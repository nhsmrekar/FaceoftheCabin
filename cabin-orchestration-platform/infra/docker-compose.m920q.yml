# M920q Cabin Hub overlay
#
# Existing cabin stack (at /storage/containers/compose/cabin/) runs:
#   mosquitto (1883), homeassistant (host network/8123), nodered (1880),
#   frigate (5000), zigbee2mqtt (8080), homepage (3000),
#   uptime-kuma (3001), mediamtx, blinkbridge
# All on the Docker network: cabin_default
#
# This overlay:
#   - Disables FaceoftheCabin services that conflict with the existing stack
#   - Fixes Kafka advertised listener for container-to-container use
#   - Shifts Grafana to port 3002 (3000=homepage, 3001=uptime-kuma)
#   - Adds cabin-backend (port 8090) joined to cabin_default to reach mosquitto
#   - Adds cabin-ui (port 4080) with Tailscale IPs baked into the build
#
# Usage (from cabin-orchestration-platform/infra/):
#   cp .env.m920q.example ../.env   # fill in HA_TOKEN and passwords
#   docker compose -f docker-compose.yml -f docker-compose.m920q.yml up -d --build
#
# Dashboard: http://100.77.44.113:4080  (Tailscale or LAN)
# Backend:   http://100.77.44.113:8090/actuator/health

services:

  # ── Disabled — already running in the existing cabin stack ────────────
  mqtt:
    profiles: [disabled]

  homeassistant:
    profiles: [disabled]

  nodered:
    profiles: [disabled]

  frigate:
    profiles: [disabled]

  watchdog:
    profiles: [disabled]

  # ── Prometheus: the base service only joins the project's own default
  # network, but the real Frigate this scrapes is the pre-existing M920q
  # container on cabin_default (frigate itself is disabled above). Join
  # that network too so "frigate:5000" in prometheus.yml can resolve —
  # NOT yet confirmed live; see infra/prometheus.yml's header comment.
  prometheus:
    networks:
      - default
      - cabin_default

  # ── Fix Kafka advertised listener for container networking ────────────
  # Base compose advertises localhost:9092 which breaks container clients.
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cabin-kafka:9092

  # ── Grafana: disable base (ports merge, not replace) then redefine ────
  # Docker Compose merges ports arrays across files so the override port
  # doesn't replace 3000 — it adds to it, causing a conflict with homepage.
  # Solution: disable the base service and define cabin-grafana separately.
  grafana:
    profiles: [disabled]

  cabin-grafana:
    image: grafana/grafana:latest
    container_name: cabin-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cabin_grafana}
      # TEMPORARY, 2026-08-04: disabled the password login form entirely.
      # Cloudflare Access was confirmed NOT actually gating
      # grafana.unicornpingpong.com (a fresh, cookie-free request reached
      # Grafana's own login page directly, no Access challenge) at the
      # same time Grafana's own Google OAuth was separately failing with
      # a Google-side 403 for reasons not yet found (test user confirmed
      # present, People API enabled, redirect URI/client/scopes all
      # correctly formed). Rather than leave a guessable admin password
      # reachable from the open internet overnight with neither gate
      # confirmed working, this closes the actual exploitable surface:
      # nobody can log in via password (including the admin), and the
      # still-broken Google button also can't be exploited by a random
      # attacker (they wouldn't be on the OAuth consent screen's test
      # user list either way). Re-enable once Access is confirmed
      # actually enforcing (see docs/MAINTENANCE.md's Grafana section)
      # -- delete this whole flag, don't just flip it to "false".
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"   # required for iframe embed in cabin-ui
      # Found 2026-08-07 (user-reported: Monitoring panel's Grafana embed
      # white-screened): ALLOW_EMBEDDING permits the browser to render
      # Grafana in a cross-origin iframe (cabin.unicornpingpong.com
      # embedding grafana.unicornpingpong.com) at all, but says nothing
      # about whether the SESSION COOKIE is sent inside that iframe.
      # Grafana's default cookie SameSite policy (lax) blocks that in a
      # third-party-iframe context in modern browsers, so the embed
      # redirected to a login page it couldn't actually authenticate
      # through -- confirmed live: the user WAS validly signed in on the
      # main Grafana tab the whole time. SameSite=None is the standard,
      # documented fix for cross-origin embedding, and REQUIRES Secure
      # (browsers reject SameSite=None without it) -- root_url above is
      # genuinely https, set explicitly rather than relying on
      # version-dependent auto-detection from root_url's scheme.
      GF_SECURITY_COOKIE_SAMESITE: "none"
      GF_SECURITY_COOKIE_SECURE: "true"
      # Found 2026-08-03 (user report: "won't load off Tailscale"):
      # %(domain)s and %(http_port)s in root_url are template variables
      # Grafana fills from its OWN [server] domain/http_port settings --
      # neither was ever set here, so they defaulted to domain=localhost
      # and http_port=3000 (Grafana's internal container port, with no
      # idea this host remaps it to 3002). Every request to the real,
      # externally-reachable address (any browser, Tailscale or not) got
      # redirected to http://localhost:3000/grafana/ -- "localhost" on
      # the VIEWER'S OWN machine, which obviously has nothing listening
      # there. Not a network/firewall/Tailscale problem at all -- curl
      # reached cabin-grafana over the Tailscale IP just fine; only the
      # redirect Location header was wrong. Fixed by making root_url
      # fully explicit instead of template-substituted.
      # UPDATED 2026-08-04: moved off the Tailscale IP to a real HTTPS
      # hostname behind Cloudflare Tunnel + Access, so Grafana is reachable
      # without a Tailscale client (the whole point of this change -- see
      # docs/MAINTENANCE.md's Grafana section). GRAFANA_EXTERNAL_HOST's
      # meaning changed with it: was "Tailscale IP for the http://ip:3002
      # redirect fix," now "public hostname for the https:// redirect."
      # Nothing had overridden it yet, so changing the default is safe.
      GF_SERVER_ROOT_URL: "https://${GRAFANA_EXTERNAL_HOST:-grafana.unicornpingpong.com}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Google OAuth (added 2026-08-04, same move as above). Reuses the
      # SAME Google Cloud OAuth client as family-hub/cabin-ui
      # (GOOGLE_CLIENT_ID) rather than registering a second app -- "one
      # OAuth client to manage, one place to see who's authorized" was the
      # explicit requirement, not literal zero-click SSO across apps
      # (Grafana's OAuth is its own server-side redirect; being already
      # signed into that Google account in-browser just makes it a fast
      # click-through, not a shared session). GOOGLE_CLIENT_SECRET empty
      # (the default) leaves this block effectively inert -- Grafana falls
      # back to its own admin/password login, never locked out.
      GF_AUTH_GOOGLE_ENABLED: "true"
      GF_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GF_AUTH_GOOGLE_SCOPES: "https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email"
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: "true"
      # NOT YET VERIFIED end-to-end -- `allowed_emails` is a real Grafana
      # Google-OAuth setting in reasonably recent releases, but this
      # hasn't been confirmed against whatever `grafana/grafana:latest`
      # resolves to at actual deploy time. Confirm on first real login
      # (docs/MAINTENANCE.md's checklist) that an email NOT in ADMIN_EMAILS
      # is genuinely refused, not just untested.
      GF_AUTH_GOOGLE_ALLOWED_EMAILS: ${ADMIN_EMAILS:-}
      # grafana/provisioning/datasources/timescale.yml references
      # ${POSTGRES_PASSWORD} for the CabinDB datasource, but this container
      # never actually received that env var — found 2026-08-02 while
      # rotating the cabin-postgres password. Grafana only expands env vars
      # in provisioning YAML that are present in ITS OWN container
      # environment, not just anywhere in the compose file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabin_dev_password}
    ports:
      - "3002:3000"
    volumes:
      - cabin_grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - default
    depends_on:
      - postgres

  # ── FaceoftheCabin Spring Boot backend ───────────────────────────────
  cabin-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Explicit, SHA-taggable name -- without this, `docker compose build`
    # auto-names the image `infra-cabin-backend:latest` (project dir +
    # service name), which can't hold more than one version at a time.
    # deploy-cabin-backend.yml sets IMAGE_TAG=<git sha> per deploy so the
    # previous image stays addressable for rollback; unset (plain
    # `docker compose up -d cabin-backend`, e.g. for local/manual work)
    # falls back to :latest exactly like before this existed.
    image: cabin-backend:${IMAGE_TAG:-latest}
    container_name: cabin-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabin_dev_password}
      MQTT_URL: tcp://mosquitto:1883        # reach existing mosquitto via cabin_default
      HA_URL: http://192.168.2.46:8123      # HA on host network — use LAN IP
      HA_TOKEN: ${HA_TOKEN:-}
      HOME_HA_URL: ${HOME_HA_URL:-http://home-hub:8123}
      HOME_HA_TOKEN: ${HOME_HA_TOKEN:-}
      KAFKA_BOOTSTRAP: cabin-kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://cabin-postgres:5432/cabin
      # Same Web Client ID family-hub signs in with (see family-hub's
      # GOOGLE_CLIENT_ID below) — GoogleAuthInterceptor checks the "aud"
      # claim on tokens sent to /api/notes and /api/chores against this, so
      # a token from an unrelated Google app can't be used to write here.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # The same explicit account list used by Family Hub establishes who may
      # create the shared first-party platform session. Device lifecycle
      # authority remains a separate, narrower policy.
      CABIN_PLATFORM_AUTH_EMAILS: ${ADMIN_EMAILS:-}
      # Tech ID Service findings-submission key -- optional, empty by
      # default (submission returns 503 until an operator sets this).
      # See docs/REPLICATION.md §8.
      TECH_ID_API_KEY: ${TECH_ID_API_KEY:-}
      # ntfy.sh topic for CRITICAL alert push (NtfyAlertPublisher) -- optional,
      # empty by default (CRITICAL events still persist, just no phone push).
      # Real value lives only in infra/.env on this host, never committed.
      CABIN_ALERT_NTFY_TOPIC: ${CABIN_ALERT_NTFY_TOPIC:-}
      # Template configuration fields (docs/REPLICATION.md §2/§4) --
      # surfaced read-only in the Config panel's Platform/Remote Access
      # cards via DashboardController. This instance's real values.
      CABIN_INSTANCE_PLATFORM: ${CABIN_INSTANCE_PLATFORM:-Self-hosted — Lenovo ThinkCentre M920q, Ubuntu 24.04, x86_64}
      CABIN_INSTANCE_REMOTE_ACCESS: ${CABIN_INSTANCE_REMOTE_ACCESS:-Tailscale,Cloudflare Tunnel}
      # Found 2026-08-08: HubLocationService.seedIfEmpty() only ever runs
      # once (guarded by `SELECT COUNT(*) FROM hub_locations` == 0), and
      # its @Value defaults were the SAME broken Docker-internal
      # placeholder hosts (http://cabin-hub:8090 etc.) the frontend's own
      # LOCATIONS constant falls back to when unconfigured -- nothing
      # here ever set the real ones, so the seeded row silently
      # overrode every correct VITE_CABIN_* URL below (mergeHubLocations
      # lets API data win) since the day this table was first created.
      # Root-caused live via a direct user report: devices, Grafana,
      # Node-RED, and the Live MQTT tile were ALL broken by this one row
      # simultaneously. Live data corrected via PATCH /api/locations/cabin
      # first (this table only seeds once, so that was required regardless
      # of this change); these env vars are what make a FUTURE reseed
      # (fresh Postgres volume, disaster recovery, a new instance
      # following REPLICATION.md) seed correctly from the start instead
      # of reintroducing the exact same bug.
      CABIN_LOCATIONS_CABIN_API_BASE: ${CABIN_API_URL:-https://api.unicornpingpong.com}
      CABIN_LOCATIONS_CABIN_WS_BASE: ws://100.77.44.113:9001
      CABIN_LOCATIONS_CABIN_GRAFANA_URL: https://${GRAFANA_EXTERNAL_HOST:-grafana.unicornpingpong.com}
      CABIN_LOCATIONS_CABIN_NODERED_URL: https://nates-little-m920q.tailb20f8b.ts.net
      CABIN_LOCATIONS_CABIN_HA_URL: http://100.77.44.113:8123
      CABIN_LOCATIONS_CABIN_FRIGATE_URL: http://100.77.44.113:5000
      CABIN_LOCATIONS_CABIN_Z2M_URL: http://100.77.44.113:8080
      CABIN_LOCATIONS_CABIN_FAMILY_HUB_URL: ${FAMILY_HUB_URL:-https://hub.unicornpingpong.com}
    volumes:
      # Read-only mount so OntologyLookupService can resolve entity ids to
      # display names for the Opportunity Map (and future data-dictionary
      # UI) without baking docs/ into the image -- the build context is
      # ../backend only. See OntologyLookupService's javadoc.
      - ../../docs:/app/docs:ro
    networks:
      - default         # project network: reaches cabin-postgres, cabin-kafka
      - cabin_default   # existing network: reaches mosquitto, nodered, z2m
    depends_on:
      - postgres
      - kafka

  # ── Smrekar Family Hub (nginx, static files) ─────────────────────────
  family-hub:
    build:
      context: ../../family-hub
      dockerfile: Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        ADMIN_EMAILS: ${ADMIN_EMAILS:-}
        CABIN_API_URL: ${CABIN_API_URL:-https://api.unicornpingpong.com}
    container_name: family-hub
    restart: unless-stopped
    ports:
      - "4081:80"
    networks:
      - default

  # ── FaceoftheCabin React UI (nginx, static build) ────────────────────
  cabin-ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        # Public now (api.unicornpingpong.com — needs a Cloudflare Tunnel
        # public hostname route added manually, see docs/EXECUTION_PLAN_2026-07-30.md /
        # session notes; cloudflared here is token-managed, not a local
        # config file this repo can drive). Core device list/status and the
        # Family Hub link both need this to work for a non-Tailscale visitor.
        VITE_CABIN_API_BASE: ${CABIN_API_URL:-https://api.unicornpingpong.com}
        # Left Tailscale-only deliberately: raw MQTT pub/sub (device control
        # channel, not just viewing), and every embed below is a direct
        # admin/reconfiguration surface (Node-RED flow editor, Frigate NVR
        # admin, full Home Assistant admin, Zigbee2MQTT admin) — a
        # meaningfully different risk than the read-only status/link-out
        # this round is actually about. Those specific panels just won't
        # load for a non-Tailscale visitor; the rest of the app is
        # unaffected. Revisit only if that's explicitly wanted too.
        VITE_CABIN_WS_BASE: ws://100.77.44.113:9001
        # UPDATED 2026-08-04: Grafana explicitly moved OUT of the
        # Tailscale-only group above, per direct user request ("won't
        # load off Tailscale" was actually a broken redirect, not this
        # boundary — but once fixed, the user still wanted real off-
        # Tailscale reachability). Now behind Cloudflare Tunnel + Access,
        # gated by the same Google OAuth client as this app rather than
        # network location. Frigate/HA above are UNCHANGED — this was a
        # Grafana-specific decision, not a blanket policy change to the
        # Tailscale-only boundary for admin surfaces. See
        # docs/MAINTENANCE.md's Grafana section.
        VITE_CABIN_GRAFANA_URL: https://${GRAFANA_EXTERNAL_HOST:-grafana.unicornpingpong.com}
        # UPDATED 2026-08-08: was http://100.77.44.113:1880. cabin-ui is
        # served over HTTPS (Cloudflare), and that plain-HTTP iframe src
        # was mixed content -- browsers silently block it, which is what
        # rendered as the Rules & Alerts panel's blank Node-RED embed.
        # Fixed with `tailscale serve` (real Let's Encrypt cert via
        # Tailscale's own tailnet, `tailscale set --operator=nate` +
        # `tailscale serve --bg 1880` on the M920q) instead of the
        # Grafana approach above -- this keeps Node-RED's existing,
        # deliberate Tailscale-only boundary intact (still unreachable
        # off-tailnet) while making it a real HTTPS origin so the iframe
        # actually loads. Confirmed serving: `curl -s -o /dev/null -w
        # '%{http_code}' https://nates-little-m920q.tailb20f8b.ts.net/`
        # -> 200.
        VITE_CABIN_NODERED_URL: https://nates-little-m920q.tailb20f8b.ts.net
        VITE_CABIN_FRIGATE_URL: http://100.77.44.113:5000
        VITE_CABIN_HA_URL: http://100.77.44.113:8123
        VITE_CABIN_Z2M_URL: http://100.77.44.113:8080
        VITE_CABIN_FAMILY_HUB_URL: ${FAMILY_HUB_URL:-https://hub.unicornpingpong.com}
        # Same Web-application OAuth client family-hub uses (see that
        # service's GOOGLE_CLIENT_ID above) — needs
        # cabin.unicornpingpong.com added as an authorized JS origin on
        # that same Google Cloud client, a manual one-time step.
        VITE_CABIN_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: cabin-ui
    restart: unless-stopped
    ports:
      - "4080:80"
    networks:
      - default
    depends_on:
      - cabin-backend

networks:
  cabin_default:
    external: true
    name: cabin_default   # the network all existing cabin containers share
