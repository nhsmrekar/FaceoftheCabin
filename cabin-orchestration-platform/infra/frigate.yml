# Frigate NVR configuration used by the M920q cabin stack.
# https://docs.frigate.video
#
# CAMERA_PASSWORD is supplied through the Frigate container environment.
# The M920q processes cameras at both Cabin and Home; camera-key prefixes
# describe the physical location, not the host running Frigate.

mqtt:
  host: mosquitto
  port: 1883
  topic_prefix: cabin/camera
  client_id: frigate

review:
  alerts:
    labels: [person, car, bicycle, motorcycle, truck, bus, bear, dog, cat]

cameras:
  # Cabin Reolink RLC-820A.
  front_door:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{CAMERA_PASSWORD}@192.168.2.200:554/h264Preview_01_sub
          roles: [detect]
        - path: rtsp://admin:{CAMERA_PASSWORD}@192.168.2.200:554/h264Preview_01_main
          roles: [record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    objects:
      track: &tracked_objects [person, car, bicycle, motorcycle, truck, bus, bear, dog, cat]

  # Cabin Blink Outdoor 4 via blinkbridge and MediaMTX.
  driveway:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://mediamtx:8554/outdoor_4_-_dhee
          roles: [detect, record]
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    objects:
      track: *tracked_objects

  # Home Blink camera processed on the M920q. Live inspection confirmed
  # blinkbridge publishes AldrichFront to this credential-free container
  # endpoint. Manual Live View is recordable here; automatic triggering
  # separately depends on Blink exposing a cloud motion event.
  home_aldrich_front:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://mediamtx:8554/aldrichfront
          roles: [detect, record]
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    objects:
      track: *tracked_objects

detectors:
  cpu1:
    type: cpu
    num_threads: 2

record:
  enabled: true
  alerts:
    pre_capture: 15
    post_capture: 60
  detections:
    pre_capture: 15
    post_capture: 60
  continuous:
    days: 5

snapshots:
  enabled: true

version: 0.17-0

classification:
  custom:
    Person On Foot:
      enabled: true
      name: Person On Foot
      threshold: 0.8
      object_config:
        objects: [person]
        classification_type: attribute
