      last_checked: "2026-08-03"
      new_alternatives: false
      other_options: false
      new_api_available: true
      deprecated: false
      notes: >
        FIRST REAL CHECK (2026-08-03, via live web search). Findings: (1)
        Reolink has shipped newer RLC-810A/820A firmware with an added
        webhook function and improved exposure/night-vision correction —
        can't confirm whether this camera is on the latest firmware while
        it's off-network; check once it's physically reconnected. (2)
