  - id: hub_location
    entity_type: owl:Class
    layer: backend
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: used
    first_used:
      date: "2026-08-07"
      ref: "Phase 7 §1b, commit fd580ad"
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Hub Location"
    source: >
      Postgres hub_locations table via cabin-backend's /api/locations
      (built 2026-08-07, Phase 7 §1b — see
      docs/EXECUTION_PLAN_2026-08-07_template-theme-camera.md). Previously
      this was ONLY a hardcoded `const LOCATIONS = { cabin: {...}, home:
      {...} }` object in cabin-ui's App.jsx — a real source edit + redeploy
      was required to add a location. Table is seeded once (if empty) from
      this instance's own cabin.locations.* Spring properties (defaulting
      to the same cabin-hub/home-hub values App.jsx's env vars already
      assumed), so a fresh instance's first startup writes exactly what
      the frontend already expected — not a hardcoded literal here.
    rendering:
      semantic: "A place this platform manages (Cabin, Home, …)"
      systems: Hub Location
      technical: "HubLocation(id, label, apiBase, wsBase, grafanaUrl, noderedUrl, haUrl, frigateUrl, z2mUrl, familyHubUrl, sortOrder, active, createdAt, updatedAt) — Spring Data JdbcTemplate row in hub_locations"
      compliance: (not shown)
    definition: >
      One property/hub this platform instance manages — its display label
      plus every downstream service URL a UI surface needs to link to or
      embed (backend API, WebSocket, Grafana, Node-RED, Home Assistant,
      Frigate, Zigbee2MQTT, that location's own Family Hub deployment).
      The concrete implementation of ROADMAP.md's Northstar Goal #1 ("no
      hard architectural assumption" about how many properties exist) and
      of REPLICATION.md's location-awareness claim actually being
      runtime-configurable, not just fork-time find-and-replace.
    relationships:
      - target: device_descriptor
        type: consumed_by
        cardinality: "1:N"
      - target: cabin_grafana_public_access
        type: complements
        cardinality: "1:1"
      - target: hub_brand_block
        type: complements
        cardinality: "N:1"
    transformation: >
      cabin-ui's useHubLocations() hook (App.jsx) fetches GET
      /api/locations on load and merges each row into the still-present
      LOCATIONS module-level object by id — cabin/home stay as hardcoded,
      env-var-driven fallback defaults (~30 other call sites in App.jsx
      still read LOCATIONS.cabin/.home directly and assume those two keys
      exist), and any additional or overridden location the backend knows
      about is merged in on top, triggering a re-render so
      LocationSwitcher and the My Places (FamilyHubPanel) card grid pick
      it up without a source change. Verified live 2026-08-07 against a
      stub /api/locations response returning a third, entirely fictional
      location ("Lake House") not present anywhere in source — it
      correctly appeared in both the switcher and the card grid.
    relates_to:
      ui_components: [ui_location_switcher, ui_my_places_grid]
      elements: [device_descriptor, hub_brand_block]
    notes: >
      Soft delete (active=false), same rationale as family_profile:
      DeviceDescriptor.location is a free-standing string reference to a
      location id, so hard-deleting one a device still points at would
      silently orphan it.

      SCOPE NOTE (honest, not silently narrowed): this ships the backend
      CRUD + a safe, limited frontend merge, not a full rewrite of every
      LOCATIONS.cabin/.home reference in App.jsx. Several cross-cutting
      features (usePresence, useNavAlerts, the /api/system/health poll)
      still hardcode LOCATIONS.cabin.apiBase as "the" primary backend to
      reach — that's an existing architectural assumption (cabin as
      primary), not something this change silently altered. Making THOSE
      genuinely N-location-aware, plus an admin UI for add/edit, plus
      wiring per-location Grafana dashboard provisioning to this table,
      are the still-open remainder of Phase 7 §1a/§1b/§3.

      CARD REORDER, built 2026-08-07 (Phase 7 §3): "My Places"
      (FamilyHubPanel) cards are now drag-reorderable via
      useDraggableOrder, same as Device Manager/Monitoring — but this is
      client-side, per-browser localStorage["order.places"], NOT the
      POST /api/locations/reorder endpoint above, which remains built and
      available but genuinely unused by any UI. Deliberate choice matching
      the user's own "the same way we allow re-ordering of devices"
      phrasing, not an oversight — a server-synced order is a real,
      separate future option if wanted. Verified: a real drag-and-drop
      test dispatches actual dragstart/dragover/drop events and confirms
      localStorage updates (cabin-ui's App.test.jsx), plus live-verified
      at 3 viewport widths that the grid is responsive (3/2/1 columns).
      NOT built: per-card field configurability (which stats/links show —
      still fixed) and dynamic card-size shrinking to guarantee 9 cards
      with zero scrolling at any count (today it just scrolls past 9).

      NOT yet verified: the actual Postgres round-trip (CREATE TABLE IF
      NOT EXISTS, seed-if-empty, CRUD) against a live database — this
      session's sandbox has no Docker daemon available to run one.
      Backend compiles clean and follows FamilyProfileService's exact,
      already-production-proven JdbcTemplate pattern, but that specific
      claim ("it works against real Postgres") is unverified, not assumed
      true. A real Testcontainers-against-Postgres test now exists
      (`HubLocationServiceTest`, same pattern as `EventPipelineIntegrationTest`)
      covering seed/create/upsert/patch-merge/archive/reorder — written and
      confirmed to fail ONLY on "no Docker environment" in this sandbox
      (not a code defect), wired into `deploy-cabin-backend.yml`'s existing
      `mvn test` gate so it actually runs against real Postgres on the
      next push, before anything deploys.

