      docs/DEFINITION_OF_DONE.md
    rendering:
      semantic: "24/7 camera footage, browsable by date/time"
      systems: Continuous (DTM) Recording
      technical: "Frigate record.continuous.days (currently 0.0 = disabled); segments stored under /media/frigate in the frigate container, backed by /storage on the host"
      compliance: Continuous Video Retention Record
    definition: >
      Unedited camera footage recorded around the clock, independent of
      any detected event — distinct from cabin_camera_event_clip, which is
      only the buffered window around a specific detection. This is what
      "(d) review of all DTM-based video" in the 2026-08-02 planning
      conversation refers to — a full timeline, not a curated event list.
    relationships:
      - target: cabin_camera_live_view
        type: consumed_by
        cardinality: "1:N" # live view's "review what I just watched" need is satisfied by this, not a separate capture mechanism
      - target: platform_secret
        type: depends_on
