# FaceoftheCabin Platform Ontology
# ─────────────────────────────────────────────────────────────────────────────
# This file is the semantic contract for the entire platform.
# It describes every named element — hardware, infrastructure, code constructs,
# APIs, data fields, UI labels, and cross-cutting references — at the
# intersection of all platform layers.
#
# This is NOT a data model, schema, or frontend/backend spec.
# It is the authoritative definition of what things ARE, what layer they live
# on, how they relate to other elements, and how they should be rendered
# per audience context.
#
# Audiences:
#   semantic    — plain English, no jargon (Mom, casual user)
#   systems     — named concepts with values and thresholds (analyst, operator)
#   technical   — raw identifiers, types, protocols (developer, technician)
#   compliance  — audit-relevant metadata and confidence indicators (adjuster)
#
# Layer taxonomy:
#   hardware    — physical devices and their firmware identity
#   protocol    — communication standards (Zigbee, MQTT, HTTP, Tailscale)
#   integration — bridges between layers (Z2M, HA, Paho MQTT client)
#   infra       — runtime environment (Docker, Postgres, Kafka, Linux host)
#   backend     — Spring Boot application layer
#   frontend    — React UI layer / static HTML Family Hub
#   network     — connectivity fabric (LAN, Tailscale, Docker networks)
#   ontology    — this file and the semantic layer itself
#
# ─────────────────────────────────────────────────────────────────────────────
# Schema v0.3.0 — OWL/Collibra-aligned master data structure
# ─────────────────────────────────────────────────────────────────────────────
#
# Top-level per-element fields:
#   id:               canonical snake_case identifier (unique across platform)
#   entity_type:      owl:Class | owl:DatatypeProperty | owl:ObjectProperty
#   layer:            layer taxonomy value (see above)
#   primitive:        true = source value; false = derived or composite
#   schema_version:   "0.3.0" — all entries now at current schema
#   migration_status: complete
#   first_verified_live: (optional, added 2026-08-07) — when and how this
#                     concept was first confirmed real, not assumed:
#                     a date plus what specifically was checked (a real
#                     API response, a real registry query, a real
#                     reading) — never "confirmed" on the strength of a
#                     config entry's presence alone or a prior session's
#                     say-so. Distinct from schema_version (that's the
#                     documentation format's version) and from
#                     discovery.last_checked (that's about periodically
#                     re-checking for upgrades/alternatives, a different
#                     question from "does this work at all").
#   lifecycle_status: (optional, schema v0.4.0, added 2026-08-07) —
#                     used | unused | deprecated | candidate | derived_concept
#                     — whether this concept is actually live in the
#                     running system right now. Distinct from
#                     migration_status (that's about this ENTRY's own
#                     documentation format currency, not the underlying
#                     concept's real-world status) and from data_class
#                     (that's about data nature — raw vs. derived — not
#                     usage lifecycle). User-specified requirement
#                     (2026-08-07): every element should be able to answer
#                     "is this still real" without asking. NOT backfilled
#                     across all existing entries in one pass — see
#                     ROADMAP.md's "Ontology Migration Review" section for
#                     the v0.4.0 migration-priority approach (same pattern
#                     already used for the v0.3.0 migration). Every entry
#                     ADDED from 2026-08-07 onward carries this field from
#                     day one; existing entries pick it up as they're
#                     otherwise touched, or in scheduled priority-order
#                     migration passes.
#   first_used:       (optional, schema v0.4.0) — { date, ref } — date is
#                     when this concept actually entered the running
#                     system (not when this ontology entry was written,
#                     though those often coincide for new entities); ref
#                     is free text pointing at the most specific real
#                     evidence available — a commit hash, a ROADMAP.md
#                     phase/section name, a PRODUCT_NOTES.md session date.
#                     Free text rather than an enum deliberately, same
#                     precedent as TechIdFinding.provider (ROADMAP.md's
#                     Tech ID Provider Model) — never blocked on a missing
#                     enum value. Only recorded when a real, citable date
#                     exists in this file or git history — never guessed.
#   deprecated_date:  (optional, schema v0.4.0) — set only when
#                     lifecycle_status is deprecated or unused; the date
#                     this concept stopped being live, with the same
#                     citation standard as first_used.ref.
#   data_class:       raw | derived | conceptual | composite
#   data_type:        XSD primitive (xsd:string, xsd:boolean, xsd:integer,
#                     xsd:decimal, xsd:date, xsd:anyURI, xsd:hexBinary)
#                     or owl:Class for structured/composite entries
#   constraint:       optional restrictions: {maxLength, pattern, enum,
#                     format, locale, range, description}
#   primitive_type_group: groups all representations of the same semantic concept
#                     across different data types or encodings
#   ui_display_name:  literal string shown in the UI — authoritative display
#                     anchor; may repeat across entries (uniqueness =
#                     ui_display_name + data_type + id)
#   source:           origin system, API, or storage key
#   rendering:        audience-specific value rendering hints (replaces label)
#     semantic:       what Mom sees
#     systems:        what the analyst sees
#     technical:      what the developer sees
#     compliance:     what the adjuster sees
#   definition:       one-sentence plain English description
#   relationships:    structured edge list (replaces derives_from + used_by)
#     - target:       id of related element
#       type:         derives_from | consumed_by | triggers | depends_on |
#                     replaces | extends | complements | monitors | controls |
#                     notifies
#       cardinality:  1:1 | 1:N | N:1 | N:M
#   normal_range:     expected value envelope (optional, sensor readings)
#   transformation:   source→middle→target pipeline description
#   relates_to:       supplemental groupings (ui_components, elements)
#   notes:            implementation notes, constraints, known issues
# ─────────────────────────────────────────────────────────────────────────────

version: "0.3.0"
status: draft
maintainer: FaceoftheCabin platform team
last_updated: "2026-07-28"

# ═══════════════════════════════════════════════════════════════════════════
# HARDWARE ELEMENTS
# Physical devices and their immutable identity
# ═══════════════════════════════════════════════════════════════════════════

elements:

  - id: zigbee_ieee_address
    entity_type: owl:DatatypeProperty
    layer: hardware
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:hexBinary
    constraint:
      description: 64-bit hardware address burned at manufacture; immutable
      format: "0x{16 hex chars} (e.g. 0x00124b0014d8a1c3)"
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: IEEE Address
      technical: ieee_address (e.g. 0x00124b0014d8a1c3)
      compliance: Device Hardware ID
    definition: >
      The globally unique 64-bit hardware address burned into every Zigbee
      chip at manufacture. Immutable. The lowest-level identity of a physical
      device, independent of any pairing, naming, or software state.
    relationships:
      - target: z2m_friendly_name
        type: consumed_by
        cardinality: "1:N"
      - target: zigbee_model
        type: consumed_by
        cardinality: "1:1"
      - target: zigbee_vendor
        type: consumed_by
        cardinality: "1:1"
      - target: linkquality
        type: consumed_by
        cardinality: "1:N"
      - target: battery_percent
        type: consumed_by
        cardinality: "1:N"
      - target: temperature_celsius
        type: consumed_by
        cardinality: "1:N"
      - target: humidity_percent
        type: consumed_by
        cardinality: "1:N"
      - target: contact_state
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Never changes even if device is reset, re-paired, or renamed.
      Use as the stable foreign key when correlating across Z2M, HA, and
      FaceoftheCabin records. Not surfaced in UI except in technical view.

  - id: zigbee_model
    entity_type: owl:DatatypeProperty
    layer: hardware
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: manufacturer model string as reported by device firmware
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Device Model
      technical: model (e.g. SNZB-02, SNZB-04)
      compliance: Hardware Model
    definition: >
      Manufacturer model string identifying the hardware capabilities and
      firmware baseline of a Zigbee device.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: device_install_photo
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Used to infer device type in Zigbee2MqttAdapter.inferType().
      Also used to look up spec sheet photos from Z2M device database
      (https://github.com/Koenkk/zigbee2mqtt.io/tree/master/public/images/devices)
      as install-time thumbnail fallback when user has not taken a photo.

  - id: zigbee_vendor
    entity_type: owl:DatatypeProperty
    layer: hardware
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: manufacturer name string as reported by device firmware
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Manufacturer
      technical: vendor (e.g. SONOFF, Aqara)
      compliance: Manufacturer
    definition: Manufacturer name string as reported by the Zigbee device.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: device_install_photo
        type: consumed_by
        cardinality: "1:1"

# ═══════════════════════════════════════════════════════════════════════════
# PROTOCOL ELEMENTS
# Communication standards and their identifiers
# ═══════════════════════════════════════════════════════════════════════════

  - id: z2m_friendly_name
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      pattern: "^[a-z0-9_]+$"
      description: snake_case only; no spaces; protocol-enforced by MQTT topic parsing
    ui_display_name: "(not shown — use display_name instead)"
    rendering:
      semantic: (not shown — use display_name instead)
      systems: Z2M Friendly Name
      technical: friendly_name (e.g. door_second_contact)
      compliance: Sensor Identifier
    definition: >
      The human-assigned snake_case name for a Zigbee device as configured
      in Zigbee2MQTT. Forms the MQTT topic path and is the stable internal
      key for all Z2M operations. Must use snake_case — spaces break MQTT
      topic parsing.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: mqtt_topic
        type: consumed_by
        cardinality: "1:1"
      - target: mqtt_availability_topic
        type: consumed_by
        cardinality: "1:1"
      - target: fotc_device_id
        type: consumed_by
        cardinality: "1:1"
      - target: display_name
        type: consumed_by
        cardinality: "1:1"
    notes: >
      This is a primitive that is intentionally NOT surfaced in any UI
      audience except technical. It is the seed from which display_name
      is derived. Changing this in Z2M renames the MQTT topic and requires
      re-mapping in FaceoftheCabin device metadata.

  - id: mqtt_topic
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      pattern: "^zigbee2mqtt/[a-z0-9_]+$"
      description: constructed from Z2M topic prefix + friendly_name
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: MQTT Topic
      technical: zigbee2mqtt/{friendly_name}
      compliance: (not shown)
    definition: >
      The MQTT publish/subscribe path for a device's state messages.
      Constructed from the Z2M topic prefix and the device friendly_name.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:N"

  - id: mqtt_availability_topic
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: used
    data_class: raw
    data_type: xsd:string
    constraint:
      pattern: "^zigbee2mqtt/[a-z0-9_]+/availability$"
      description: payload is JSON {state:\"online\"} or {state:\"offline\"}
    ui_display_name: "Connection status"
    rendering:
      semantic: Connection status
      systems: Availability
      technical: zigbee2mqtt/{friendly_name}/availability
      compliance: Sensor Online Status
    definition: >
      Z2M publishes {"state":"online"} or {"state":"offline"} to this topic
      when a device joins or leaves the Zigbee mesh. This is the authoritative
      online/offline signal — more reliable than inferring from data messages.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:1"
      - target: z2m_retained_availability_probe_result
        type: consumed_by
        cardinality: "1:N"
    notes: >
      FaceoftheCabin uses this as the primary state signal. Data message
      arrival (linkquality present) is a secondary signal. See
      Zigbee2MqttAdapter.handleAvailability().

# ═══════════════════════════════════════════════════════════════════════════
# INTEGRATION ELEMENTS
# Bridges between layers
# ═══════════════════════════════════════════════════════════════════════════

  - id: fotc_device_id
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      pattern: "^z2m-[a-z0-9_]+$"
      description: integration-source prefix namespaces across multiple adapters
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Device ID
      technical: z2m-{friendly_name} (e.g. z2m-door_second_contact)
      compliance: Platform Device ID
    definition: >
      FaceoftheCabin's internal stable identifier for a device. Prefixed
      with the integration source (z2m-, home-, etc.) to namespace across
      multiple integration adapters.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:N"
      - target: device_command
        type: consumed_by
        cardinality: "1:N"
      - target: display_name
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Never shown in semantic or systems UI. Technical and compliance views
      show it alongside display_name for cross-reference.

  - id: display_name
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      maxLength: 100
      description: user-defined; UI falls back to cleaned z2m_friendly_name if absent
    ui_display_name: "Back Door Sensor"
    rendering:
      semantic: Device name (e.g. "Back Door Sensor")
      systems: Display Name
      technical: displayName (device metadata table)
      compliance: Sensor Label
    definition: >
      The human-readable name for a device as set by the user at install
      time or via the settings panel. Completely independent of z2m_friendly_name.
      This is what every non-technical audience sees everywhere in the platform.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: fotc_device_id
        type: depends_on
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Stored in device metadata table in Postgres. Seeded at first discovery
      with a cleaned version of friendly_name (underscores to spaces, title
      case) as a prompt default. User can override at any time.
      If not set, UI falls back to cleaned friendly_name — never raw snake_case.

  - id: device_room
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      maxLength: 80
      vocabulary: soft_enum
      vocabulary_source: "location_vocabulary_term (applies_to: device_room)"
      description: >
        User structured selection from a curated room-name list. Values outside
        the master list trigger a candidate_term_submission automatically.
    ui_display_name: "Kitchen"
    rendering:
      semantic: Room (e.g. "Kitchen", "Back Porch")
      systems: Room / Zone (L1 — room-level location)
      technical: room (device metadata table, snake_case; L1 of location_context)
      compliance: Installation Location (L1)
    definition: >
      The room-level (L1) location of a device within the installation site.
      User selects from a curated soft-enum list. Custom values auto-submit a
      candidate_term_submission for master vocabulary review.
    relationships:
      - target: display_name
        type: depends_on
        cardinality: "N:1"
      - target: device_location_zone
        type: consumed_by
        cardinality: "1:N"
      - target: device_location_formatted
        type: consumed_by
        cardinality: "1:N"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"

  - id: device_install_photo
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:anyURI
    constraint:
      description: URL to user photo, Z2M spec image, or generic icon; fallback hierarchy applied
    ui_display_name: "Photo"
    rendering:
      semantic: Photo
      systems: Install Photo
      technical: photoUrl (device metadata table)
      compliance: Installation Evidence
    definition: >
      Photo taken at device install time showing the physical device and its
      location. Used as tile background or thumbnail. Serves as visual memory
      aid for all audiences and installation evidence for compliance.
    relationships:
      - target: zigbee_model
        type: derives_from
        cardinality: "N:1"
      - target: zigbee_vendor
        type: derives_from
        cardinality: "N:1"
    notes: >
      Fallback hierarchy: user photo → Z2M device database spec image
      (keyed by zigbee_model) → generic device type icon.
      Prompted once at first device discovery. Stored as URL (local or CDN).

# ═══════════════════════════════════════════════════════════════════════════
# LOCATION CONTEXT ELEMENTS
# Structured multi-level location identity for every installed device.
# Primitive type group: device_location (L1–L3 + derived formatted output)
# Vocabulary feedback: custom values auto-submit candidate_term_submission
# ═══════════════════════════════════════════════════════════════════════════

  - id: location_context
    entity_type: owl:Class
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    primitive_type_group: device_location
    ui_display_name: "Location"
    rendering:
      semantic: Where this device is installed
      systems: Location Context (L1 · L2a · L2b · L3 · formatted)
      technical: >
        location_context aggregate: {device_room, device_location_zone,
        device_location_qualifier, device_location_text, device_location_formatted}
      compliance: Physical Installation Address
    definition: >
      The aggregate location identity for an installed device. Groups the full
      five-level location attribute set (L1 room, L2a zone, L2b qualifier, L3
      free text, derived formatted string) under one class so automations,
      device naming pipelines, and UI surfaces can resolve any representation
      from a single context reference.
    relationships:
      - target: device_room
        type: extends
        cardinality: "1:1"
      - target: device_location_zone
        type: extends
        cardinality: "1:1"
      - target: device_location_qualifier
        type: extends
        cardinality: "1:1"
      - target: device_location_text
        type: extends
        cardinality: "1:1"
      - target: device_location_formatted
        type: extends
        cardinality: "1:1"
    notes: >
      This class does not store data — it is a semantic grouping and the
      resolution entry point for location-aware automations and naming pipelines.
      All five member properties share primitive_type_group: device_location.

  - id: device_location_zone
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      vocabulary: soft_enum
      vocabulary_source: "location_vocabulary_term (applies_to: device_location_zone)"
      description: >
        Sub-room zone within device_room (L2a). User selects from curated list
        per room type. Values not in master list auto-submit candidate_term_submission
        with alert to user. Examples: "Floor", "Wall", "Ceiling", "Under sink",
        "Breaker box area", "Counter", "Cabinet", "Window sill"
    ui_display_name: "Zone within room"
    rendering:
      semantic: Area within the room (e.g. "Near the breaker box", "Under the sink")
      systems: Location Zone (L2a — sub-room zone)
      technical: location_zone (device metadata table; L2a of location_context)
      compliance: Installation Zone
    definition: >
      The zone-level (L2a) sub-room location of a device. A structured
      selection from a curated soft-enum vocabulary scoped to the parent
      device_room. Custom values trigger a vocabulary candidacy submission
      and user alert, and are excluded from automation logic until promoted.
    relationships:
      - target: device_room
        type: derives_from
        cardinality: "N:1"
      - target: device_location_qualifier
        type: consumed_by
        cardinality: "1:N"
      - target: device_location_formatted
        type: consumed_by
        cardinality: "1:N"
      - target: candidate_term_submission
        type: triggers
        cardinality: "1:N"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Soft enum: the UI presents a dropdown of master terms for the selected
      device_room. "Other — describe it" option opens a free-text field and
      submits candidate_term_submission on save. Custom values are stored but
      flagged as non-master; automations that reference device_location_zone
      by value will not match a custom value until it is promoted to master.

  - id: device_location_qualifier
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      vocabulary: soft_enum
      vocabulary_source: "location_vocabulary_term (applies_to: device_location_qualifier)"
      description: >
        Positional descriptor within device_location_zone (L2b). User selects
        from curated list per zone type. Examples: "North wall", "South wall",
        "Left side", "Right side", "Above drain", "Eye level", "Floor level",
        "Port 1", "Port 2". Custom values auto-submit candidate_term_submission.
    ui_display_name: "Position within zone"
    rendering:
      semantic: Exact position (e.g. "North wall, about 4 feet up")
      systems: Location Qualifier (L2b — positional within zone)
      technical: location_qualifier (device metadata table; L2b of location_context)
      compliance: Installation Qualifier
    definition: >
      The positional (L2b) descriptor within a zone. Answers "where exactly
      within the zone." Soft enum scoped to parent device_location_zone.
      Custom values trigger candidacy submission and user alert.
    relationships:
      - target: device_location_zone
        type: derives_from
        cardinality: "N:1"
      - target: device_location_formatted
        type: consumed_by
        cardinality: "1:N"
      - target: candidate_term_submission
        type: triggers
        cardinality: "1:N"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Same soft-enum + candidacy pattern as device_location_zone. Both L2a and
      L2b custom values submit separate candidate_term_submission records with
      distinct applies_to context so the review queue can distinguish them.

  - id: device_location_text
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      maxLength: 500
      description: >
        Free text narrative (L3). Annotation only — excluded from all automation
        logic and device naming derivations. Shown to semantic and compliance
        audiences only.
    ui_display_name: "Description"
    rendering:
      semantic: Description (e.g. "On the north wall next to the breaker box, about 4 feet up")
      systems: Location Narrative (L3 — free text annotation)
      technical: location_text (device metadata table; L3 of location_context; unstructured)
      compliance: Installation Description
    definition: >
      A free-text narrative description of the device's physical location.
      Intended for human readability (semantic and compliance audiences) only.
      Not used in automation rules, device naming, or any derived computation.
      The semantic audience fallback when L1+L2 structured context is insufficient.
    relationships:
      - target: device_location_qualifier
        type: depends_on
        cardinality: "N:1"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    notes: >
      L3 does NOT feed candidate_term_submission — it is deliberately unstructured
      and is not a vocabulary candidate. If the user's L3 text suggests a new
      structured concept, the reviewer promotes it by adding a master term to
      location_vocabulary_term and linking it to L2a or L2b.

  - id: device_location_formatted
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      description: >
        System-generated; never user-entered. Multiple format variants produced
        from the same L1+L2 source: snake_case (MQTT/Z2M), camelCase (JSON keys),
        PascalCase (HA entity IDs), Title Case (display labels). Only master-list
        L1 and L2 values are included; custom/candidate values are excluded until
        promoted.
    ui_display_name: "(system generated)"
    rendering:
      semantic: (not shown — system internal)
      systems: Formatted Location String (protocol-safe variants)
      technical: >
        location_formatted_{variant} (device metadata table):
        snake_case → "basement_mech_room_north_wall"
        camelCase  → "basementMechRoomNorthWall"
        PascalCase → "BasementMechRoomNorthWall"
        label      → "Basement · Mech Room · North Wall"
      compliance: (not shown)
    definition: >
      Protocol-safe location strings derived from device_room (L1),
      device_location_zone (L2a), and device_location_qualifier (L2b).
      Generated in multiple format variants to satisfy naming constraints across
      MQTT topics, HA entity IDs, Z2M friendly_name seeds, and UI display labels.
      Eliminates all manual format entry for device orchestration pipelines.
    relationships:
      - target: device_room
        type: derives_from
        cardinality: "N:1"
      - target: device_location_zone
        type: derives_from
        cardinality: "N:1"
      - target: device_location_qualifier
        type: derives_from
        cardinality: "N:1"
      - target: z2m_friendly_name
        type: consumed_by
        cardinality: "1:1"
      - target: fotc_device_id
        type: consumed_by
        cardinality: "1:1"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      Source: device_room.value + device_location_zone.value +
              device_location_qualifier.value (master-list values only).
      Middle: normalize each segment → lowercase, strip punctuation, replace
              spaces with underscores → join with _ for snake_case.
              camelCase: capitalize each segment after first, join.
              PascalCase: capitalize all segments, join.
              label: Title Case segments joined with " · ".
      Target: stored as location_formatted_{variant} columns in device metadata table.
      Regenerated: on any L1/L2 change, on vocabulary term promotion.
    notes: >
      Custom (non-master) L1/L2 values are excluded from formatted output —
      the pipeline produces an empty/partial string and raises a UI warning
      ("Location not fully standardized — formatted name unavailable until
      reviewed terms are approved"). This is intentional: it prevents
      non-standard strings from entering MQTT topics or HA entity IDs.

  - id: location_vocabulary_term
    entity_type: owl:Class
    layer: ontology
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Location vocabulary term"
    rendering:
      semantic: (not shown — admin only)
      systems: Location Vocabulary Term
      technical: >
        location_vocabulary_term table: {id, value, applies_to,
        parent_room_types[], status, usage_count, source}
      compliance: Master Data Term Record
    definition: >
      A single entry in the master controlled vocabulary for location attributes.
      Shared by all three location soft-enum properties (device_room, L2a, L2b).
      Each term is scoped to one or more room types via parent_room_types, or
      global (applies to all rooms). Terms have a lifecycle: candidate → master
      → deprecated.
    relationships:
      - target: device_room
        type: controls
        cardinality: "1:N"
      - target: device_location_zone
        type: controls
        cardinality: "1:N"
      - target: device_location_qualifier
        type: controls
        cardinality: "1:N"
      - target: candidate_term_submission
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Fields per term:
        id:               snake_case canonical ID
        value:            display string (e.g. "Breaker box area")
        applies_to:       device_room | device_location_zone | device_location_qualifier
        parent_room_types: [] (empty = global; ["basement"] = basement only)
        status:           master | candidate | deprecated
        usage_count:      integer — computed from device metadata records
        source:           system | user_submission
      Deprecated terms remain in the table for historical device records.
      Master terms are included in the UI dropdown. Candidates are queued
      for review but not yet shown in the dropdown.

  - id: candidate_term_submission
    entity_type: owl:Class
    layer: ontology
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Candidate vocabulary term"
    rendering:
      semantic: (not shown — admin only)
      systems: Candidate Term Submission
      technical: >
        candidate_term_submission record: {id, term_value, applies_to,
        context_device_id, context_room, submitted_at, review_status,
        approved_as_term_id, submission_count}
      compliance: Vocabulary Candidacy Record
    definition: >
      A record created automatically whenever a user enters a value not present
      in the master location_vocabulary_term list for any soft-enum location
      attribute. Queued for manual review; eventually automated promotion based
      on submission frequency and semantic similarity to existing terms.
    relationships:
      - target: device_location_zone
        type: derives_from
        cardinality: "N:1"
      - target: device_location_qualifier
        type: derives_from
        cardinality: "N:1"
      - target: location_vocabulary_term
        type: consumed_by
        cardinality: "N:1"
    transformation: >
      Trigger: user enters custom value in any soft-enum location field + saves.
      Source: {term_value, applies_to (L2a or L2b), context_device_id,
               context_room (device_room.value), submitted_at: now()}.
      Middle: check existing submissions — if term_value+applies_to already
              exists as candidate, increment submission_count only (no duplicate).
              If new, create record with review_status: pending.
      Alert: UI displays inline notice: "'{value}' isn't in our standard list.
             It's been submitted for review — if approved, it'll appear in the
             dropdown for all users."
      Review queue: admin sees pending submissions ranked by submission_count desc.
      Promotion: admin (or eventually: auto-promote at submission_count >= threshold)
              sets review_status: approved, creates location_vocabulary_term with
              status: master, source: user_submission. approved_as_term_id links back.
      Rejection: review_status: rejected; term remains stored on the device record
              but excluded from formatting pipeline and future dropdowns.
    notes: >
      submission_count deduplication: same term_value + applies_to across different
      devices increments the count on one record (not N records). This makes the
      review queue a ranked frequency list, not a flood of duplicates.
      Automation candidacy: a term with review_status: candidate is NOT available
      as an automation trigger value — only master terms qualify. This is enforced
      at the automation rule editor layer.
      Future: NLP/embedding similarity check on submission to flag near-duplicates
      of existing master terms before creating a new candidate record (e.g.
      "mech room" vs "mechanical room" → suggest existing term, ask user to confirm).

# ═══════════════════════════════════════════════════════════════════════════
# DEVICE STATE ELEMENTS
# Runtime readings and their semantic definitions
# ═══════════════════════════════════════════════════════════════════════════

  - id: device_state
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      enum: [ONLINE, OFFLINE, UNKNOWN, ALARM]
      description: UNKNOWN is transient — resolves within 5 min of backend start
    ui_display_name: "Online"
    rendering:
      semantic: Status (Online / Offline / Alert)
      systems: Device State (ONLINE / OFFLINE / UNKNOWN / ALARM)
      technical: state field on DeviceStatus
      compliance: Operational Status
    definition: >
      The current operational state of a device. Derived from Z2M availability
      topic (primary) and data message presence (secondary). UNKNOWN means
      the platform has not yet received a state signal since last restart.
    relationships:
      - target: mqtt_availability_topic
        type: derives_from
        cardinality: "N:1"
      - target: linkquality
        type: derives_from
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    notes: >
      UNKNOWN is a transient state, not a stable one. If a device stays
      UNKNOWN for >5 minutes after backend start, treat as a connectivity
      issue. See QA check: devices-z2m.

  - id: device_checkin_status
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: used
    first_used:
      date: "2026-08-08"
      ref: "DeviceHealthMonitor, DeviceController.checkinStatus()"
    data_class: derived
    data_type: xsd:string
    constraint:
      enum: [ON_SCHEDULE, LATE, MISSED, NOT_CONFIGURED]
      description: >
        Distinct axis from device_state. ON_SCHEDULE = reported within its
        expected interval. LATE = past that interval but not yet confirmed
        unreachable (grace tier, device_state stays whatever it was).
        MISSED = past a 3x grace multiple, and for ha_rest devices only
        after an active poll (DeviceRegistry.activeFetch) also failed --
        device_state flips to OFFLINE at this tier, same trigger point as
        before this entity existed. NOT_CONFIGURED = descriptor disabled
        (not yet installed) or missing; staleness tracking is skipped
        entirely, so a disabled device is never reported as broken.
    ui_display_name: "Checkin Status"
    rendering:
      semantic: "Is this actually broken, or just hasn't checked in yet"
      systems: "Late checking in / Not responding / Not configured badges (Device Manager, Monitoring)"
      technical: "GET /api/devices/checkin-status -> { [deviceId]: status }; checkinStatusLabel() (App.jsx) overrides the state-badge text/class, never for ALARM/CRITICAL"
      compliance: (not shown)
    definition: >
      User report, 2026-08-08, verbatim: "devices that show offline are
      not necessarily offline just not reporting. this is misleading."
      device_state's binary ONLINE/OFFLINE conflated "hasn't pushed an
      update yet" with "confirmed unreachable" -- this entity is the
      user-facing fix, computed by DeviceHealthMonitor.checkHealth() every
      60s cycle alongside (not instead of) device_state.
    relationships:
      - target: device_state
        type: complements
        cardinality: "1:1"
      - target: z2m_retained_availability_probe_result
        type: derives_from
        cardinality: "1:1"
      - target: rtsp_socket_reachable
        type: derives_from
        cardinality: "1:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    relates_to:
      ui_components: [ui_device_manager_panel, ui_monitoring_panel]
      elements: [device_state]
    notes: >
      SCOPE NOTE (honest, not silently narrowed): the user's full ask was
      four named states ("checking in on schedule" / "not checked in on
      schedule" / "hasn't checked in" / "not configured" -- all four are
      covered here) plus "a listener with an HA, mq, or rules based
      (automation check) way to know... based on assumption that it's
      only bad if... attempts to ping it aren't successful." The active
      ping half is built for ha_rest devices (DeviceRegistry.
      activeFetch() calls the real HomeAssistantAdapter.fetchState() --
      a genuine HTTP round-trip, not a simulation). MQTT/Zigbee devices
      derive active verification from z2m_retained_availability_probe_result:
      only ONLINE recovers a stale device; OFFLINE and NO_REPLY fail closed.
      RTSP camera devices derive active verification from
      rtsp_socket_reachable. A successful connect-and-drop recovers check-in;
      failure does not suppress LATE or MISSED. The probe is deliberately
      narrower than camera_health_panel's Frigate FPS signal.

  - id: rtsp_stream_uri
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: candidate
    data_class: raw
    data_type: xsd:anyURI
    constraint:
      pattern: "^rtsp://.+$"
      description: >
        RTSP URI with a hostname or IP address and optional explicit port;
        default port is 554. Embedded credentials are permitted by existing
        descriptors but must never be logged or rendered unmasked.
    ui_display_name: "RTSP Stream Address"
    source: "DeviceDescriptor.connectionString where protocolAdapter=rtsp"
    rendering:
      semantic: (not shown)
      systems: "Camera stream address (credentials hidden)"
      technical: "rtsp://[credentials-redacted]@host[:port]/path"
      compliance: "Sensitive connection configuration (redacted)"
    definition: >
      The configured RTSP network address used to locate a camera stream,
      including its host, optional port, and stream path.
    relationships:
      - target: rtsp_socket_reachable
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Candidate because the five Home descriptors are disabled and have not
      been verified against deployed cameras. This entry defines configuration,
      not reachability or video health. Never expose URI user-info in logs.

  - id: rtsp_socket_reachable
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: candidate
    data_class: derived
    data_type: xsd:boolean
    constraint:
      description: >
        true when a TCP socket connects to the host and resolved RTSP port
        before the configured timeout; false for invalid configuration,
        DNS failure, timeout, refusal, or other connection failure.
    ui_display_name: "Camera Endpoint Reachable"
    transformation: >
      parse redaction-safe host and port from rtsp_stream_uri -> bounded TCP
      connect -> immediately close socket -> true on connect, false otherwise
    rendering:
      semantic: "Camera answered / Camera did not answer"
      systems: "RTSP endpoint reachable: Yes / No"
      technical: "Java Socket.connect(host, port, timeout); no RTSP request"
      compliance: (not shown)
    definition: >
      Whether the configured camera host accepted a TCP connection on its
      RTSP port during an active connect-and-drop liveness check.
    relationships:
      - target: rtsp_stream_uri
        type: derives_from
        cardinality: "N:1"
      - target: rtsp_connect_timeout_ms
        type: depends_on
        cardinality: "N:1"
      - target: device_checkin_status
        type: consumed_by
        cardinality: "1:N"
      - target: camera_health_panel
        type: complements
        cardinality: "N:1"
    notes: >
      Deliberately narrow. true confirms network/service-port reachability and
      is accepted as active check-in recovery for an enabled RTSP descriptor.
      It does NOT prove RTSP authentication, protocol negotiation, decodable
      frames, or camera FPS; camera_health_panel remains authoritative for
      actual Frigate stream production. Candidate until verified against a
      real enabled camera from the running backend.

  - id: rtsp_connect_timeout_ms
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: candidate
    data_class: raw
    data_type: xsd:integer
    constraint:
      range:
        min: 100
        max: 10000
      description: >
        Bounded TCP connection timeout in milliseconds. Values outside the
        range are clamped; default is 2000.
    ui_display_name: "Camera Reachability Timeout"
    source: "RTSP_CONNECT_TIMEOUT_MS -> cabin.devices.cameras.rtspConnectTimeoutMs"
    rendering:
      semantic: (not shown)
      systems: "Camera check timeout: N ms"
      technical: "cabin.devices.cameras.rtspConnectTimeoutMs (100..10000; default 2000)"
      compliance: (not shown)
    definition: >
      The maximum time the active RTSP connect-and-drop check waits for a
      camera endpoint to accept a TCP connection.
    relationships:
      - target: rtsp_socket_reachable
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Candidate with the RTSP probe. Kept bounded so one unreachable camera
      cannot hold DeviceHealthMonitor indefinitely.

  - id: mqtt_message_retained
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: candidate
    data_class: raw
    data_type: xsd:boolean
    constraint:
      description: >
        true when the MQTT broker delivered this publication from retained
        storage in response to a subscription; false for ordinary live traffic.
    ui_display_name: "Retained MQTT Message"
    source: "Paho MqttMessage.isRetained()"
    rendering:
      semantic: (not shown)
      systems: "Retained replay: Yes / No"
      technical: "MqttMessage.isRetained(): boolean"
      compliance: (not shown)
    definition: >
      Whether an MQTT publication was replayed from the broker's retained
      message store rather than received as ordinary live traffic.
    relationships:
      - target: z2m_retained_availability_probe_result
        type: consumed_by
        cardinality: "1:N"
    notes: >
      This is transport metadata, not device availability. The availability
      value remains defined by mqtt_availability_topic. For the Z2M liveness
      probe, both facts are required: retained=true and availability=online.
      Candidate until verified against the real M920q broker; unit tests alone
      do not establish lifecycle_status used or first_verified_live.

  - id: z2m_retained_availability_probe_result
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: candidate
    data_class: derived
    data_type: xsd:string
    constraint:
      enum: [ONLINE, OFFLINE, NO_REPLY]
      description: >
        ONLINE = retained online replay arrived before timeout. OFFLINE =
        retained offline replay arrived. NO_REPLY = disconnected broker,
        timeout, malformed retained payload, or no retained reply.
    ui_display_name: "Zigbee Availability Check"
    transformation: >
      subscribe zigbee2mqtt/{friendly_name}/availability -> require retained
      MQTT replay -> normalize payload state -> ONLINE | OFFLINE | NO_REPLY
    rendering:
      semantic: "Availability check result"
      systems: "Online / Offline / No reply"
      technical: "Optional<Boolean>: true=ONLINE, false=OFFLINE, empty=NO_REPLY"
      compliance: (not shown)
    definition: >
      The normalized result of actively asking the MQTT broker to replay one
      Zigbee device's retained authoritative availability value.
    relationships:
      - target: mqtt_message_retained
        type: derives_from
        cardinality: "1:1"
      - target: mqtt_availability_topic
        type: derives_from
        cardinality: "1:1"
      - target: device_checkin_status
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Fail closed: only ONLINE may recover a stale device. OFFLINE and
      NO_REPLY never suppress LATE or MISSED classification. Per the product
      owner's 2026-08-08 ontology decision, retained online is accepted as
      active reachability confirmation. Candidate until verified against the
      real M920q broker and devices.

  - id: linkquality
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:integer
    constraint:
      range:
        min: 0
        max: 255
      description: Zigbee LQI — higher is better; >= 150 is good
    ui_display_name: "Signal"
    rendering:
      semantic: Signal (● ● ● / ● ● ○ / ● ○ ○)
      systems: Link Quality (0–255 LQI)
      technical: linkquality attribute (Zigbee LQI)
      compliance: Signal Confidence
    definition: >
      Zigbee Link Quality Indicator. A 0–255 integer representing the RF
      signal quality between a device and its nearest mesh router or
      coordinator. Higher is better.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:N"
    normal_range:
      good: ">= 150"
      fair: "100–149"
      poor: "< 100"
    notes: >
      Rendered as dots or bars in semantic view. Shown as numeric LQI in
      technical view. Used as secondary online signal — presence of linkquality
      in a data message confirms device is transmitting.

  - id: battery_percent
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:integer
    constraint:
      range:
        min: 0
        max: 100
      description: absent attribute must not be treated as 0% — device may not report battery
    ui_display_name: "Battery"
    rendering:
      semantic: Battery (e.g. "Battery low — replace soon")
      systems: Battery (%)
      technical: battery attribute (0–100)
      compliance: Power Source Status
    definition: >
      Remaining battery level as reported by the device, expressed as a
      percentage of full charge.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    normal_range:
      ok: ">= 20"
      warn: "10–19"
      critical: "< 10"
    notes: >
      Warn threshold (20%) should proactively surface on tile badge without
      requiring drill-down. Critical threshold (10%) triggers a notification.
      Not all devices report battery — absence of battery attribute should
      not be treated as 0%.

  - id: event_severity
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      enum: [INFO, WARN, CRITICAL]
      description: >
        Distinct from device_state (device health: ONLINE/OFFLINE/UNKNOWN/
        ALARM) — this classifies the severity of one CabinEvent, not a
        device's current operational state. A device can be ONLINE while
        its most recent event was CRITICAL (e.g. an active water leak).
    ui_display_name: "Severity"
    rendering:
      semantic: Alert level (Info / Warning / Critical)
      systems: Event Severity (INFO / WARN / CRITICAL)
      technical: severity field on CabinEvent
      compliance: Alert Severity Classification
    definition: >
      The severity tier assigned to a CabinEvent at publish time, computed
      from the triggering message's raw attributes by
      AlertSeverityClassifier. CRITICAL = water_leak/smoke/alarm true.
      WARN = tamper true, battery_low true, or contact false (door open).
      Everything else is INFO.
    relationships:
      - target: device_state
        type: complements
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    notes: >
      MVP classifier only — v0. Does not yet consider armed/presence state
      (cabin/security/armed_away, cabin/presence/*), so a WARN-tier door
      event is scored the same whether the cabin is occupied or armed-away.
      That's a deliberate, tracked scope cut, not an oversight — see
      docs/DEFINITION_OF_DONE.md's punch list. (Topic corrected 2026-08-07 —
      was previously written as cabin/security/node_red_armed, a topic
      that was never actually published to; see cabin_camera_overnight_alert
      below for the real incident this caused.)
      CRITICAL events additionally trigger NtfyAlertPublisher. **Correction,
      2026-08-07**: this previously claimed it POSTs "to the same ntfy.sh
      topic cabin_camera_overnight_alert already uses" — checked by hash
      comparison, not assumed, and that claim is false: the two are
      genuinely different topics. This was written as fact without ever
      verifying it. Not yet fixed — see cabin_camera_overnight_alert's
      notes for the real state and what fixing it would involve.
      (config: cabin.alerts.ntfyTopic / CABIN_ALERT_NTFY_TOPIC, empty by
      default — no-op until an operator sets a real topic in infra/.env,
      never committed). WARN events are not pushed to avoid paging for
      every open door.

  - id: temperature_celsius
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:decimal
    constraint:
      range:
        min: -40
        max: 85
      description: reported in Celsius by Z2M; UI renders °F by default for US users
    ui_display_name: "Temperature"
    rendering:
      semantic: Temperature (e.g. "Comfortable — 72°F")
      systems: Temperature (°C / °F)
      technical: temperature attribute (float, Celsius)
      compliance: Environmental Reading
    definition: >
      Ambient temperature reading from a Zigbee temperature sensor,
      reported in degrees Celsius by Z2M.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
    normal_range:
      freeze_risk: "< 3.3"    # 38°F
      cold: "3.3–15.5"
      comfortable: "15.5–26.6"
      warm: "26.6–35"
      hot: "> 35"
    notes: >
      Stored and transmitted in Celsius. UI renders in °F by default for
      US users with semantic bracket label. Technical view shows raw °C.
      Freeze risk threshold (3.3°C / 38°F) triggers alert regardless of
      user role — safety-class reading.

  - id: humidity_percent
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
