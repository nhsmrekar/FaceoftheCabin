  # ═══════════════════════════════════════════════════════════════════════
  # ZIGBEE MESH — PAIRED DEVICES
  # Individual, uniquely-defined entries per physical device — deliberately
  # NOT collapsed into one generic "Zigbee sensor" entry. A generic entry
  # can't be independently Findable (no way to look up "the bathroom leak
  # sensor" and get its own record), isn't uniquely Accessible, isn't
  # Interoperable on its own (meaningless without cross-referencing which
  # physical device is meant), and isn't Reusable/repeatable without that
  # same external dependency. See PRODUCT_VISION.md's FAIR cross-walk.
  # WORKED EXAMPLE (2026-08-07) — template for the rest of this mesh.
  # ═══════════════════════════════════════════════════════════════════════

  - id: zigbee_leak_alarm_bathroom
    entity_type: owl:Class
    layer: hardware
    primitive: true
    schema_version: "0.1.0"
    migration_status: complete
    first_verified_live: >
      2026-08-07, via zigbee2mqtt/bridge/devices retained MQTT message
      queried directly on the M920q: interview_completed: true,
      disabled: false. Cross-referenced against a real recent state
      message on zigbee2mqtt/leak_alarm_bathroom the same day showing a
      live water_leak: false reading with linkquality and battery
      present — not inferred from pairing status alone.
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Bathroom Leak Alarm"
    source: >
      Third Reality 3RWS18BZ Zigbee water leak sensor with built-in
      siren, paired to the cabin's Sonoff ZBDongle-E coordinator via
      Zigbee2MQTT. Origin of the raw water_leak/battery/linkquality
      values is the device's own firmware, not derived or computed by
      this platform.
    rendering:
      semantic: "Bathroom leak sensor"
      systems: Leak Sensor — Bathroom (Third Reality 3RWS18BZ)
      technical: "Z2M friendly_name 'leak_alarm_bathroom', device id z2m-leak_alarm_bathroom"
      compliance: Water Intrusion Detection — Bathroom
    definition: >
      Physical water-leak/siren sensor mounted in the bathroom, one of
      13 paired Zigbee devices on the cabin mesh. Reports water_leak
      (boolean), battery (0-100), battery_low (boolean), and linkquality
      (0-255) on every Z2M state message. Distinct from
      water_leak_buzzer, a separate sub-property on this same device
      model used by leak_spare_siren-style deployments as an intrusion
      siren — this specific paired unit uses the sensor for leak
      detection only, not as a siren trigger.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: triggers
        cardinality: "1:1" # this device's water_leak reading is one of the ONLINE/OFFLINE/ALARM inputs device_state derives from
      - target: event_severity
        type: triggers
        cardinality: "1:N" # water_leak: true on this device is one of the three conditions AlertSeverityClassifier maps to CRITICAL
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    relates_to:
      ui_components: []
      elements: [z2m_friendly_name, device_state, event_severity]
    notes: >
      Live, paired, and confirmed reporting as of 2026-08-07 — part of
      the original 13-device cabin mesh pairing session
      (2026-07-25), not added since. No discovery block: this is a
      fixed-function safety sensor with no meaningful "check for a
      better alternative" question the way a camera or smart appliance
      has one — Tech ID Service discovery is scoped to that kind of
      device, not fixed-purpose Zigbee safety sensors on a working mesh.

  # ═══════════════════════════════════════════════════════════════════════
  # CAMERAS — restructured 2026-08-07 into two layers per entity, not one.
  # A single entry that names "front door camera" AND asserts hardware
  # facts in one `source` string conflates two different kinds of truth:
  # what the device itself literally is (primitive — a firmware/vendor
  # fact) vs. what role it's been assigned (derived — a human/workflow
  # decision that could change, e.g. if the unit gets remounted or
  # swapped, without the hardware facts changing at all). See
  # PRODUCT_NOTES.md's 2026-07-26 z2m_friendly_name/display_name split
