# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — CHORES
# Elements defining, assigning, tracking, and displaying daily chore state.
# Source: CHORES constant array + localStorage["smrekar_chore_completion"]
# ═══════════════════════════════════════════════════════════════════════════

  - id: chore_definition
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Brush teeth"
    source: CHORES constant array (hardcoded in family-hub.html)
    rendering:
      semantic: Chore (e.g. "Brush teeth", "Make bed")
      systems: Chore Definition
      technical: CHORES[{id, label, tags, minAge}] constant array
      compliance: (not shown)
    definition: >
      A named household task with a minimum age threshold and tags indicating
      category (hygiene, tidy, responsibility, learning, care).
      Defines the universe of tasks that can be assigned to kids.
    relationships:
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Static constant in code. choresByAge(age) filters CHORES where
      minAge <= age to return the eligible subset for a given child.
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_today_chores_card]
      elements: [chore_assignment, family_profile]
    notes: >
      Current chore IDs: brush_teeth, make_bed, reading, clear_table,
      unload_dishwasher, take_trash, walk_frankie, homework (age >= 9);
      set_table, wipe_table, outfit_ready, lunch_backpack, put_away_laundry
      (age < 9). Rotating daily extra selected by dayOfMonth % rotating.length.

  - id: chore_assignment
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Today's chores for Sam"
    source: chore_definition + family_profile + parenting_home_days + system clock
    rendering:
      semantic: Today's chores for {kid name}
      systems: Chore Assignment (day × kid)
      technical: defaultAssignments(dayKey, kidId) → Chore[]
      compliance: (not shown)
    definition: >
      The computed list of chores assigned to a specific child on a specific
      calendar day. Derived from the child's age (for eligibility), the day
      of the month (for rotating extra chore), and the fixed daily set.
    relationships:
      - target: chore_definition
        type: derives_from
        cardinality: "N:1"
      - target: family_profile
        type: derives_from
        cardinality: "N:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: chore_completion_state
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Source: kid.age + dayKey (YYYY-MM-DD).
      daily = [brush_teeth, make_bed, reading] (always assigned).
      rotating extra = rotating[parseInt(dayKey.split('-')[2]) % rotating.length].
      assignment = [...daily, extra].filter available by choresByAge(kid.age).
    relates_to:
      ui_components: [ui_today_chores_card, ui_chore_tracker_tab]
      elements: [chore_definition, family_profile, chore_completion_state]

  - id: chore_completion_state
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:boolean
    constraint:
      description: keyed by date + kidId + choreId; default false when absent; no expiry
    ui_display_name: "Done ✓"
    source: >
      cabin-backend POST/GET /api/chores/completion (Postgres table
      chore_completion), mirrored into localStorage["smrekar_chore_completion"]
      as an offline cache/fallback when signed out or cabin-backend is
      unreachable.
    rendering:
      semantic: Done ✓ / Not done yet
      systems: Chore Completion (day × kid × choreId → boolean)
      technical: completion[dayKey_kidId][choreId] → boolean (in-memory, backed by cabin-backend)
      compliance: (not shown)
    definition: >
      The persisted record of which chores have been completed by which child
      on which day. Stored as a nested JSON structure keyed by date, kid ID,
      and chore ID. Written on every tap of a chore row.
    relationships:
      - target: chore_assignment
        type: depends_on
        cardinality: "N:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      User taps chore row → toggleChoreCompletion(dayKey, kidId, choreId) →
      optimistic local flip + re-render, then POST /api/chores/completion/toggle
      (Bearer: signed-in Google access token, validated server-side against
      Google's tokeninfo endpoint) → server toggles the Postgres row and
      returns the authoritative boolean, reconciled back into the local copy
      if a concurrent toggle from another device raced it.
      Read: getChoreState(dayKey, kidId, choreId) returns boolean (default
      false) from the in-memory cache; refreshCompletionFromServer() pulls
      the full map from cabin-backend on sign-in and every 20s poll.
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_today_chores_card]
      elements: [chore_assignment, reward_eligibility, chore_daily_view, chore_daily_success]
    notes: >
      Structure: { "2026-07-27": { "sam": { "brush_teeth": true, ... }, ... } }.
      No expiry — historical data used for reward lookback window.
      FIXED (2026-08-01): the localStorage-only cross-device gap flagged
      2026-07-31 is closed for the raw per-chore boolean — see
      cabin-orchestration-platform/backend's family/ package
      (ChoreCompletionService, ChoresController). The >=3/>=4 threshold
      *derivations* (chore_daily_success / chore_weekly_success below) are
      still computed live client-side from this synced raw data, not
      persisted server-side as their own materialized facts — that part is
      still planned, see those entities' notes.

      CORS PREFLIGHT BUG, found and fixed 2026-08-03 (see
      docs/DEFINITION_OF_DONE.md's FOURTH CHECK-IN): GoogleAuthInterceptor
      rejected every CORS preflight OPTIONS request with 401, since it
      checked for a Bearer token on OPTIONS the same as any other method —
      a preflight never carries one. This silently broke this entity's
      sync from any real browser this entire time (curl-based testing
      never caught it, since curl doesn't enforce the browser rule that a
      preflight response itself must be a plain 2xx). Fixed by exempting
      OPTIONS from the token check entirely. Don't trust any earlier
      "verified working" claim about this entity's sync in this file
      without checking whether it predates the fix.

  - id: chore_daily_success
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: planned
    data_class: derived
    data_type: xsd:boolean
    ui_display_name: "Qualifying day"
    source: chore_completion_state, aggregated server-side (queued — not built yet)
    rendering:
      semantic: "Qualifying day (3+ chores done)"
      systems: Daily Chore Success Flag
      technical: "countDayCompleted(dayKey,kidId) >= 3 — today this is derived
        live, client-side, from chore_completion_state every time it's read"
      compliance: Daily Chore Threshold Record
    definition: >
      Whether a kid completed enough chores (the existing >=3 threshold
      already used by rewardEligibility()) on a given day to count as a
      "successful day." The comparison logic already exists and is correct
      — what's queued is persisting the *result* as a stored fact per day,
      not only computing it live from raw per-chore-per-day records, same
      reasoning as custody_day_log for the parenting schedule.
    relationships:
      - target: chore_completion_state
        type: derives_from
        cardinality: "N:1"
      - target: chore_weekly_success
        type: consumed_by
        cardinality: "1:N"
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_today_chores_card]
      elements: [chore_completion_state, chore_weekly_success]
    notes: >
      PARTIALLY BUILT (2026-08-01): the raw layer this derives from
      (chore_completion_state) now syncs cross-device via cabin-backend's
      /api/chores/completion. This flag itself is still only computed live,
      client-side (countDayCompleted(dayKey,kidId) >= 3), from that synced
      data — not yet persisted server-side as its own stored fact. Still
      queued if a materialized version is ever needed (e.g. for a future
      history/analytics view that shouldn't have to re-walk raw completion
      rows), but not required for the cross-device correctness gap that
      prompted this — synced raw data + live client-side derivation already
      produces the same answer on every device.

  - id: chore_weekly_success
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: planned
    data_class: derived
    data_type: xsd:boolean
    ui_display_name: "Reward-eligible week"
    source: chore_daily_success, aggregated over a rolling 7-day home-day window
    rendering:
      semantic: "Reward unlocked this week"
      systems: Weekly Chore Success Flag
      technical: "rewardEligibility(kidId, homeDays) — today this is derived
        live, client-side (qualifying >= 4 of the last 7 home days)"
      compliance: Weekly Reward Eligibility Record
    definition: >
      Whether a kid qualified for a reward in a rolling 7-day window (the
      existing >=4-qualifying-days threshold in reward_eligibility). Same
      "persist the derived fact, don't only compute it live" reasoning as
      chore_daily_success — lets a week's eligibility be looked up directly
      instead of re-walking 7 days of raw completion data every time.
    relationships:
      - target: chore_daily_success
        type: derives_from
        cardinality: "N:1"
      - target: reward_eligibility
        type: extends
        cardinality: "1:1"
    relates_to:
      ui_components: [ui_rewards_tab]
      elements: [chore_daily_success, reward_eligibility]
    notes: >
      Same status as chore_daily_success (2026-08-01): its raw input now
      syncs cross-device, this aggregate is still only derived live,
      client-side, not persisted server-side as its own fact. Still queued
      if a materialized version is ever needed.

  - id: family_note
    entity_type: owl:Class
    layer: backend
    primitive: true
    schema_version: "0.1.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:complexType
    constraint:
      description: >
        text non-empty; authorId must reference a family_profile id (not
        enforced by a DB foreign key — profiles are per-device localStorage,
        see notes below); newest-first; capped at 50, oldest pruned.
    ui_display_name: "Family Note"
    source: >
      cabin-backend POST/GET /api/notes (Postgres table family_notes),
      mirrored into localStorage["smrekar_family_notes"] as an offline
      cache/fallback when signed out or cabin-backend is unreachable.
    rendering:
      semantic: "<author avatar> <author name>: <text>, <relative time>"
      systems: Family Notepad entry (id, authorId, text, ts)
      technical: "FamilyNote(id, authorId, text, ts) — Spring Data JdbcTemplate row in family_notes"
      compliance: Family Notepad Message Record
    definition: >
      A single free-text message left on the shared family notepad —
      "same trust as a fridge note," any signed-in actor can post as any
      profile (attributed via the shared currentActorId acting context —
      see current_actor's 2026-08-02 update — not access-controlled per
      author). Requires an explicitly selected actor; never silently
      defaults to a profile no one chose.
    relationships:
      - target: family_profile
        type: depends_on
        cardinality: "N:1"
    transformation: >
      User types + sendNote() → POST /api/notes {authorId, text} (Bearer:
      signed-in Google access token, validated server-side against Google's
      tokeninfo endpoint) → server assigns id ("n_<epochMs>_<rand6>") and ts,
      inserts, prunes anything past the newest 50, returns the created row.
      Read: refreshNotesFromServer() pulls GET /api/notes on sign-in and
      every 20s poll while signed in; loadNotes() serves the in-memory
      cache (or the localStorage mirror before the first successful fetch).
    relates_to:
      ui_components: [ui_notepad]
      elements: [family_profile]
    notes: >
      BUILT (2026-08-01) to close the cross-device gap noted in
      chore_completion_state's history — same cabin-backend family/ package
      (FamilyNoteService, NotesController) and the same GoogleAuthInterceptor
      gate on /api/notes and /api/chores/**. KNOWN GAP NOT covered by this
      work: family_profile itself (the id an authorId references) is still
      localStorage-only, per device — the built-in kid/parent/pet defaults
      share fixed ids across every fresh device by default, so this mostly
      doesn't matter, but a profile added on one device (e.g. a Friends &
      Family / guest entry) won't resolve to a name/avatar on another until
      profiles are synced too. Degrades gracefully today (noteRowHtml falls
      back to a generic "Family" label + 📝 for an unrecognized authorId),
      not a hard failure — just a visual gap, and a candidate for a future
      /api/profiles endpoint using the same pattern if it matters enough.

      CORS PREFLIGHT BUG, found and fixed 2026-08-03 (see
      docs/DEFINITION_OF_DONE.md's FOURTH CHECK-IN): GoogleAuthInterceptor
      rejected every CORS preflight OPTIONS request with 401, since it
      checked for a Bearer token on OPTIONS the same as any other method —
      a preflight never carries one. This silently broke this entity's
      sync from any real browser this entire time (curl-based testing
      never caught it, since curl doesn't enforce the browser rule that a
      preflight response itself must be a plain 2xx). Fixed by exempting
      OPTIONS from the token check entirely. Don't trust any earlier
      "verified working" claim about this entity's sync in this file
      without checking whether it predates the fix.

  - id: chore_daily_view
    entity_type: owl:Class
    layer: frontend
