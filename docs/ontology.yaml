      keyword-filtered search is only as good as its keyword list, and a
      family that names devices playfully ("Loonie Mc Frigerton",
      matching "Unicorn Loonstar" for the cabin WiFi elsewhere in this
      file) will defeat any filter built from generic category words.
      The reliable method is an unfiltered dump of the whole registry,
      cross-referenced by device_id against entities — not a substring
      match — every time "does X exist" needs a real answer.

