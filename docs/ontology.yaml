      exists and is provisioned into this same Grafana instance (see
      cabin_grafana_frigate_dashboard) — completely unrelated to this
      entity's own broken-access problem. The dashboard is real and
      correctly wired; it is simply unreachable by anyone until one of
      the two access gates documented above actually works. Don't
      conflate "a dashboard exists" with "Grafana access works" — they
      are two independent Phase 7 §1a sub-items, only one of which
      progressed this session.

      CORRECTED 2026-08-07 (M920q SSH access became available partway
      through this session): an earlier version of this note reported a
      "new" internal-404 finding that was actually a self-inflicted
      misdiagnosis -- `curl http://localhost:3000/...` on the M920q hits
      the `homepage` container (also mapped to host port 3000), not
      Grafana at all. `docker port cabin-grafana` shows the real mapping
      is `3000/tcp -> 3002` on the host. Redone against the correct port:
      `http://localhost:3002/grafana/login` returns 200,
      `http://localhost:3002/grafana/api/health` returns 200 with a real
      `{"database":"ok","version":"13.1.1",...}` body. Grafana itself is
      completely healthy.

      MORE IMPORTANTLY: **Google OAuth login is actually working.**
      `docker logs cabin-grafana` shows a real, current, successfully
      authenticated session for `uname=nhsmrekar@gmail.com` (userId=2,
      orgId=1) browsing `https://grafana.unicornpingpong.com/grafana/...`
      from a real external IP right now -- this directly contradicts this
      entity's own "Google's own Google OAuth login fails with a
      Google-side 403" claim above and MAINTENANCE.md's matching "Current
      real state" writeup. That diagnosis was accurate as of 2026-08-04;
      it is not accurate as of 2026-08-07. Root cause of the discrepancy
      not investigated (out of scope for this correction) -- worth an
      explicit note next session on whether something changed, or whether
      the original 403 was intermittent/account-state-dependent rather
      than structural.

      Two real, still-open items found instead:
      1. The user's live session is intermittently 401ing with
         `error="[session.token.rotate] token needs to be rotated"`,
         looping every few seconds in the logs -- a real, current bug
         (likely a cookie/rotation config issue given the subpath +
         reverse-proxy setup), separate from login itself working. Not
         diagnosed further or touched this session -- flagged for next
         session, not fixed blind against a live account session.
      2. RESOLVED same session: `GET /grafana/api/search` initially
         returned `[]` — no dashboards provisioned — because
         cabin_grafana_frigate_dashboard's commit was still
         unpushed/undeployed. The user was live-navigating to
         `/dashboard/public` (not a real Grafana route -- hence its 404),
         looking for exactly this dashboard. Pushed this session's
         commits; `deploy-cabin-backend.yml` and the family-hub/cabin-ui
         deploy both ran and succeeded (confirmed via `gh run watch`, not
         assumed), but neither touches cabin-grafana/prometheus by design
         (same "stateful services get a considered rollout" policy as
         cabin-backend itself). Ran `docker compose up -d prometheus
         cabin-grafana` manually (with the user's explicit go-ahead,
         since it would interrupt their then-live session) --
         `cabin-prometheus` was newly created and immediately confirmed
         scraping `frigate:5000` successfully (`health: up`, zero
         errors); `cabin-grafana` was NOT recreated by compose (no
         service-definition diff), so its file-based dashboard provisioner
         never re-scanned the newly-mounted directory -- the dashboard
         JSON was physically present in the container
         (`docker exec ... ls`) but invisible to Grafana. A `docker
         restart cabin-grafana` (dropping the user's session, expected)
         fixed it -- fresh-boot provisioning found and registered it
         correctly. Confirmed live via the search API: a "Frigate" folder
         containing "Frigate Monitoring Dashboard"
         (`/grafana/d/aezbolgn22qdce/frigate-monitoring-dashboard`), all
         21 panels intact. The full data path (Frigate -> Prometheus ->
         Grafana datasource -> dashboard) is now confirmed working
         end-to-end, not just configured.

         Worth carrying forward: this project's compose-based deploy
         pattern doesn't currently have a mechanism to detect "a bind-mounted
         directory's *contents* changed, even though the service
         definition didn't" and restart accordingly -- a future dashboard/
         provisioning-file-only change would hit this same silent gap
         again unless something explicitly restarts cabin-grafana. Not
         fixed this session (would mean changing the deploy workflow's
         scope, a bigger decision than a doc correction), just named
         here so it isn't rediscovered from scratch.

      EMBED WHITE-SCREEN, found and fixed 2026-08-07 (same day, user
      re-reported it after the dashboard itself went live): cabin-ui's
      Monitoring panel embeds this dashboard in a cross-origin iframe
      (cabin.unicornpingpong.com embedding grafana.unicornpingpong.com).
      GF_SECURITY_ALLOW_EMBEDDING permits the iframe itself but says
      nothing about whether the session cookie is SENT inside it --
      Grafana's default cookie SameSite policy (lax) blocks that in a
      third-party-iframe context in modern browsers, so the embed kept
      redirecting to a login page even though the user was validly signed
      in on the main tab the whole time (confirmed live via logs before
      this fix). Fixed with GF_SECURITY_COOKIE_SAMESITE=none +
      GF_SECURITY_COOKIE_SECURE=true (the required pairing -- browsers
      reject SameSite=None without Secure) in
