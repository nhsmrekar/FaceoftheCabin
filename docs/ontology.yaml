        is genuinely the right integration path already in use, not a
        gap to fix. (3) No comparable-product alternative search performed
        yet — out of scope for this pass, camera is not being replaced,
        only evaluated for better use of what's already owned. Sources:
        community.reolink.com/topic/14753, support.reolink.com (RLC-820A
        FAQs).
    notes: >
      CONFIRMED 2026-08-03 via Frigate's own ffmpeg logs: `Connection to
      tcp://192.168.2.200:554 failed: No route to host` — genuine
      network-layer unreachability from the M920q's LAN, not a
      credentials or Frigate config problem. Still requires physical/
      on-site checking (power, cabling, whether its static IP reset);
      nothing further to try remotely.

      UPDATED 2026-08-07 — real topology found, not just a stale IP: the
      user's own router client list shows this camera (and the Liebherr
      fridge, a Nest Connect, and the Blink Sync Module) all on
      192.168.1.0/24, while the M920q's own WiFi network sits on
      192.168.2.0/24. `nmap -Pn` from the M920q against this camera shows
      every port `filtered` (silently dropped), not closed/refused.

      ROOT CAUSE CONFIRMED 2026-08-07, same day, by the user directly —
      not a second router at all. Both networks are hosted by the same
      Starlink router, on its two different WiFi bands: 2.4GHz and 5GHz.
      This Starlink unit shipped with 2.4GHz disabled by default —
      5GHz-only out of the box. The M920q joined on 5GHz. The camera,
      the Liebherr fridge's WiFi module, the Nest Connect, and the Blink
      Sync Module are all older/simpler hardware that only supports
      2.4GHz — they had no way to join any network at all until the
      user enabled the 2.4GHz band. This single router evidently assigns
      a different subnet per band (192.168.1.0/24 for 2.4GHz,
      192.168.2.0/24 for 5GHz), which is why the two groups of devices
      ended up on genuinely separate networks even though there's only
      one physical router involved — not the double-NAT/second-router
      topology this note originally speculated. That earlier theory
      (and naming the Greenwave C4000LG as the likely second router) was
      wrong — corrected here rather than left standing. See
      hw_router_c4000lg's own notes: that device is confirmed unrelated,
      unassigned spare hardware.

      Still open: whether this Starlink router can route between its
      own 2.4GHz and 5GHz subnets (many consumer routers with per-band
      subnets don't bridge them by default even though it's the same
      device), which would be the simplest possible fix if available —
      check the Starlink app/router admin for an inter-band routing or
      "same network" toggle before assuming a physical Ethernet bridge
      is required. See MAINTENANCE.md for the full diagnostic trail.

      Also corrected 2026-08-07: this entry (formerly
      camera_front_door_reolink, undivided) previously listed a literal
      username:password-shaped string in its technical rendering field.
      The user confirmed this camera has never been configured — there
      is no real credential to protect, but the field was rewritten
      regardless to stop asserting a live credential that was never
      real.

