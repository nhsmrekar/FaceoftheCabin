        cardinality: "1:1"
    relates_to:
      ui_components: [ui_monitoring_panel]
      elements: [cabin_grafana_frigate_dashboard, cabin_grafana_public_access]
    notes: >
      SCOPE NOTE (honest, not silently narrowed): today this surfaces
      exactly one metric (frigate_camera_fps) with no user-facing
      configurability. The user's actual ask goes further -- "cherry
      pick" which library metrics to show, reorder them, and tune
      minimalist-vs-maximalist layouts distinctly for kiosk vs. mobile
      form factors. Not built here; tracked as a near-term follow-up in
      ROADMAP.md, not forgotten. The Grafana link-out
      (`Open Full Dashboard in Grafana`) remains the escape hatch for
      anyone who wants the full, un-curated metric set this panel
      deliberately doesn't try to replicate.

      A user with no prior Grafana session still can't use the
      "Open Full Dashboard" link without one manual, direct sign-in
      first (Google's OAuth pages can't render in any iframe, and this
      link is a plain new-tab navigation, not an embed, so that
      specific limitation doesn't apply here) -- this panel's own tiles
      have no such dependency at all, which is the concrete UX
      improvement over the iframe it replaced.

