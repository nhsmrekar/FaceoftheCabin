  - id: instance_template_config
    entity_type: owl:Class
    layer: backend
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: used
    first_used:
      date: "2026-08-08"
      ref: "Config panel dynamic fields"
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Instance Template Config"
    source: >
      Two @Value-injected Spring properties (cabin.instance.platform,
      cabin.instance.remoteAccess), surfaced verbatim through
      DashboardController's existing GET /api/dashboard/config. Deploy-
      time config, not DB-backed — matches this codebase's established
      pattern for optional/per-instance settings (CameraMediaController's
      blinkBridgeUrl, NtfyAlertPublisher's ntfyTopic) rather than
      introducing a new admin-editable settings table for something a
      template clone sets once and rarely changes again.
    rendering:
      semantic: "What this instance runs on, and how to reach its admin surfaces remotely"
      systems: Config Panel
      technical: "DashboardController.config() -> { platform, remoteAccess } (remoteAccess: comma-separated string, split client-side)"
      compliance: (not shown)
    definition: >
      The platform/cloud description and remote-access method(s) a
      template clone is expected to set at deploy time — the concrete
      answer to ROADMAP.md Northstar Goal #1's "configurable upstream
      inputs/downstream outputs" for the parts of that goal that are
      genuinely instance-wide rather than per-hub-location (compare
      hub_location, which is per-property). Displayed in the Config
      panel's Platform and Remote Access cards.
    relationships:
      - target: hub_location
        type: complements
        cardinality: "1:N"
    transformation: >
      FamilyConfigPanel (App.jsx) reads config.platform and
      config.remoteAccess from the same /api/dashboard/config fetch the
      panel already depended on (App()'s top-level useEffect), splits
      remoteAccess on "," client-side, and renders both read-only —
      there is no write path from the UI back to these values by design;
      changing them is a deploy-time action (edit the env var, redeploy),
      not a runtime one.
    relates_to:
      ui_components: [ui_config_panel]
      elements: [hub_location]
    notes: >
      Found 2026-08-07 investigating a user request to make "Google
      Account," "Platform," and "Remote Access" genuinely dynamic instead
      of hardcoded panel text: `platformName` already looked dynamic
      (pulled from the same /api/dashboard/config response) but was
      itself a hardcoded literal server-side ("Cabin Orchestration
      Platform") — the actual hardware/OS description
      ("Lenovo ThinkCentre M920q · Ubuntu 24.04 · x86_64") and the Remote
      Access card's Tailscale description were both hardcoded directly in
      JSX with no backend field behind them at all. Fixed by adding real
      fields (this entity) rather than only rewording the hardcoded text,
      per the user's explicit ask that these be "fields that require
      entry" for a template clone's initial configuration — see
      docs/REPLICATION.md §2/§4 for the resulting required-setup entries
      (CABIN_INSTANCE_PLATFORM, CABIN_INSTANCE_REMOTE_ACCESS).

      Remote Access defaults to "Tailscale" (not empty/unconfigured) when
      unset, matching REPLICATION.md §3's documented default remote-access
      recommendation for a fresh clone — the one field here where "looks
      unconfigured" would be actively misleading rather than honest,
      since Tailscale genuinely is the intended out-of-the-box answer.

      The Google Account card is a related but separate concern, NOT
      modeled as a field on this entity: it reads live state from the
      existing useGoogleAuth() hook (accessToken/userEmail), not a new
      config value — see google_oauth_gate's own notes (if/when that
      entity exists) or ADMIN_EMAILS' existing documentation in
      REPLICATION.md §2 for the actual access-control mechanism. What
      changed here is only that the Config panel now shows the real
      signed-in account and offers Google's own account-chooser
      ("Switch Google Account", prompt: "select_account") instead of a
      hardcoded email string — switching to an account not already
      signed into Google in the same browser remains unsupported,
      tracked as an open roadmap item, not silently dropped.

  - id: family_profile
    entity_type: owl:Class
    layer: backend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Family member"
    source: >
      Postgres family_profiles table via cabin-backend's /api/profiles
      (built 2026-08-02, in response to a review's core finding that
      profiles were browser-local only — a Friends & Family guest added
      on one device never appeared on another). localStorage["family_profiles"]
      is now an offline mirror/cache, same role as NOTES_KEY for family_note —
      not the source of truth when signed in and CABIN_API_URL is reachable.
    rendering:
      semantic: Family member
      systems: Family Profile
      technical: "FamilyProfile(id, name, role, birthday, avatar, color, age, type, relation, sortOrder, active, createdAt, updatedAt) — Spring Data JdbcTemplate row in family_profiles"
      compliance: (not shown)
    definition: >
      A record representing one family member (parent, child, pet, or
      Friends & Family guest). Defines the individual's role, display
      name, avatar emoji, age (for chore eligibility), relationship (for
      guests), and accent color. Used to personalize chores, rewards,
      schedule displays, and note/actor attribution.
    relationships:
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
      - target: family_note
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Admin enters profile in Family Profiles tab → saveProfile() POSTs
      (new) or PATCHes (existing) to /api/profiles when signed in and
      CABIN_API_URL is configured, always also updating the local
      `profiles` array + localStorage regardless (offline-friendly,
      matches sendNote()'s pattern). deleteProfile() calls
      DELETE /api/profiles/{id}, which the backend treats as a soft
      delete (active=false) so historical family_note authorship still
      resolves for an archived guest. refreshProfilesFromServer() polls
      GET /api/profiles every 20s (same interval as notes/chores) and on
      sign-in; getKids()/getParents()/getPets() still just filter the
      resulting array by role, unchanged.
    relates_to:
      ui_components: [ui_profiles_tab, ui_chore_kid_selector, ui_overview_tab, current_actor]
      elements: [chore_assignment, reward_eligibility, hub_config, current_actor, family_note]
    notes: >
      DEFAULT_PROFILES seeds Sam (kid, 9), Emma (kid, 6), Frankie (pet),
      Nathan (parent) — the backend seeds the exact same four, once, only
      if the table is empty (FamilyProfileService.seedIfEmpty()), so a
      fresh instance's first sync doesn't appear to add duplicates or
      lose anyone already showing from the localStorage fallback. Age
      field determines chore_assignment eligibility via choresByAge().
      Profiles are fully configurable — no hardcoded names in rendering
      logic.

      MIGRATION SAFEGUARD (2026-08-02): the very first sync on any given
      device, after this backend shipped, checks for locally-saved
      profiles the server doesn't know about yet (e.g. a Friends & Family
      guest created during this session's own earlier testing, before
      this backend existed) and POSTs them up rather than letting the
      server's list silently overwrite/discard them. Verified: backend
      compiles clean, table auto-creates and seeds correctly on the real
      M920q (confirmed via direct Postgres query), auth gate returns 401
      without a token. Full authenticated CRUD round-trip not yet
      exercised against the live public API — deliberately not tested by
      temporarily disabling auth on a real, publicly-reachable service to
      do so; needs a real signed-in browser session to finish verifying.

      CORS PREFLIGHT BUG, found and fixed 2026-08-03 (see
      docs/DEFINITION_OF_DONE.md's FOURTH CHECK-IN): this is very likely
      *why* full CRUD verification above was never completed —
      GoogleAuthInterceptor rejected every CORS preflight OPTIONS request
      with 401, since it checked for a Bearer token on OPTIONS the same
      as any other method — a preflight never carries one. This silently
      broke this entity's sync from any real browser (curl-based testing
      never caught it, since curl doesn't enforce the browser rule that a
      preflight response itself must be a plain 2xx). Fixed by exempting
      OPTIONS from the token check entirely. Real signed-in verification
      still needed now that the actual blocker is gone.

  - id: current_actor
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: family_profile id with role kid or parent; never pet
    ui_display_name: "Who are you?"
    source: sessionStorage["smrekar_current_actor"] ({ id, lastActivity })
    rendering:
      semantic: "Viewing as: Sam"
      systems: Actor Context (id + last-activity timestamp)
      technical: "currentActorId; ACTOR_KEY sessionStorage entry"
      compliance: (not shown — explicitly not an access-control identity)
    definition: >
      Which family_profile the current browser tab is "speaking/acting as."
      Set once at Dashboard > Overview, then used as the shared default for
      every feature that previously had its own separate, narrower "who is
      this for" selector (notepad author, chore tracker's kid selector) —
      those still allow a local one-off override, they just start from this
      value now instead of an arbitrary first-profile default. Explicitly
      NOT authentication or access control: any profile can be picked by
      anyone, same trust model as a shared paper family calendar — the
      point is reducing misattribution (a note posted as the wrong kid), not
      restricting who can do what.
    relationships:
      - target: family_profile
        type: depends_on
        cardinality: "N:1"
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      setCurrentActor(id) writes { id, lastActivity: Date.now() } to
      sessionStorage and propagates to activeChoreKid.
      touchActorActivity() refreshes lastActivity on any click/touch
      inside #dashboard-overlay. checkActorTimeout() runs every 30s; if 3
      minutes have passed since lastActivity, clears the actor and (if
      the Dashboard is open) closes it back to the ambient Home view —
      renderActorPicker() then shows the "Who are you?" prompt again on
      next entry to Overview.
    relates_to:
      ui_components: [ui_overview_tab, ui_notepad, ui_chore_kid_selector]
      elements: [family_profile]
    notes: >
      sessionStorage, not localStorage, deliberately — should not survive
      closing and reopening the browser on someone's personal phone, but
      should survive an accidental same-tab reload on the always-on kiosk
      display (the 3-minute idle timer is the real reset mechanism there,
      not the tab/session boundary). Added 2026-07-31 in response to a
      real, verified bug: the Dashboard's 5-tab row (#dash-tabs) had no
      overflow handling, so the "Family" tab — the existing profile
      add/edit/delete CRUD the user was looking for — could be pushed
      fully off-screen and unreachable on a narrow phone. Fixed alongside
      this feature (scrollable tab row, hidden scrollbar, same pattern used
      elsewhere in this file) since it directly blocked reaching the
      current_actor candidate list's source of truth.

      UPDATED 2026-08-02, following an external review of Family Hub
      identity/attribution: two real bugs fixed. (1) Timeout was actually
      5 minutes, not 3 — corrected to match original intent. (2) The
      notepad used to maintain its own independent selectedNoteAuthorId
      variable, seeded with `currentActorId || profiles[0]?.id` — meaning
      a note sent with no one selected as "Who am I?" silently attributed
      to whichever profile happened to be first in the list, and picking
      a note-author pill could diverge from (and outlive the expiry of)
      the global acting context. That variable is now gone entirely — the
      notepad reads currentActorId directly and has no author state of
      its own. sendNote() now revalidates via checkActorTimeout() at the
      moment of submission (not just whatever the last 30s poll saw), and
      the composer (#notepad-input, .np-send) is disabled with a
      "Who's leaving this note?" prompt (#notepad-author-prompt) whenever
      currentActorId is null — typed text is never discarded, only held
      until an identity is chosen. Verified live via Playwright
      (family-hub/test/run.js, 23/23 passing, 7 new assertions covering
      the blocked/unblocked states and correct attribution) and via
      direct in-browser JS execution.

# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — PARENTING SCHEDULE
# Elements defining and computing the 14-day custody cycle.
# Source: localStorage["smrekar_schedule_cfg"] + hardcoded default anchor
# ═══════════════════════════════════════════════════════════════════════════

  - id: parenting_schedule_anchor
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:date
    constraint:
      format: ISO 8601 (YYYY-MM-DD)
    ui_display_name: "Schedule start date"
    source: localStorage["smrekar_schedule_cfg"].start (ISO date string)
    rendering:
      semantic: Schedule start date
      systems: Custody Cycle Anchor Date
      technical: SCHEDULE_START (Date object, loaded from smrekar_schedule_cfg.start)
      compliance: Custody Agreement Reference Date
    definition: >
      The reference date marking day 0 of the 14-day parenting custody cycle.
      All custody calculations count forward from this anchor using modular
      arithmetic on the day difference. Configurable in Settings.
    relationships:
      - target: parenting_home_days
        type: consumed_by
        cardinality: "1:1"
      - target: custody_status
        type: consumed_by
        cardinality: "1:N"
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      User enters date in Settings → saveSettings() calls saveSchedCfg() →
      localStorage["smrekar_schedule_cfg"] = {start, homeDays}.
      On load: SCHEDULE_START = new Date(s.start + 'T12:00:00').
      Default: 2026-03-13 (a Friday, day 0 of the Smrekar schedule).
    relates_to:
      ui_components: [settings_panel, ui_schedule_tab]
      elements: [parenting_home_days, custody_status]
    notes: >
      Set to noon (T12:00:00) to avoid daylight-saving boundary edge cases.
      The default anchor (2026-03-13) is the Smrekar family's agreed reference
      date and should not be changed unless the custody agreement changes.

  - id: parenting_home_days
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: JSON-serialized integer array; values in range [0,13]
      pattern: "^\\[([0-9]|1[0-3])(,([0-9]|1[0-3]))*\\]$"
    primitive_type_group: parenting_home_days
    ui_display_name: "Nights at Dad's"
    source: localStorage["smrekar_schedule_cfg"].homeDays (array of integers 0–13)
    rendering:
      semantic: "Nights at Dad's"
      systems: Kids-Home Day Indices
      technical: KIDS_HOME_DAYS (Set<number>, indices within 14-day cycle)
      compliance: Custody Schedule Days
    definition: >
      The set of day indices within the 14-day cycle on which the children
      are at the Dad's home. Index 0 = parenting_schedule_anchor date.
      Configurable in Settings via the 14-day cycle day picker grid.
    relationships:
      - target: parenting_schedule_anchor
        type: depends_on
        cardinality: "N:1"
      - target: custody_status
        type: consumed_by
        cardinality: "1:N"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Admin taps day chips in Settings → saveSchedCfg() writes Set to
      localStorage and updates KIDS_HOME_DAYS live.
      isKidsHome(date) = KIDS_HOME_DAYS.has(dayDiff % 14) where
      dayDiff = floor((date - SCHEDULE_START) / 86400000).
    relates_to:
      ui_components: [settings_panel, ui_schedule_tab, ui_chore_tracker_tab]
      elements: [parenting_schedule_anchor, custody_status]
    notes: >
      Default Smrekar schedule: [0,1,4,5,8,9,12,13] within each 14-day cycle.
      Hot-applied on save — no page reload required.

  - id: custody_status
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:boolean
    constraint:
      description: true = kids at Dad's tonight; false = kids at Mom's today
    ui_display_name: "Kids at Dad's tonight"
    source: parenting_schedule_anchor + parenting_home_days + system clock
    rendering:
      semantic: "Kids at Dad's tonight / Kids at Mom's today"
      systems: Custody Status (home | away)
      technical: isKidsHome(new Date()) → boolean
      compliance: Custody State Record
    definition: >
      The computed current custody state — whether the children are scheduled
      to be at the Dad's home tonight or at the other parent's home. Derived
      from the parenting schedule cycle and today's date. Updates every minute.
    relationships:
      - target: parenting_schedule_anchor
        type: derives_from
        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
      - target: custody_status_card
        type: consumed_by
        cardinality: "1:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: ui_top_bar
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      Source: SCHEDULE_START (Date) + KIDS_HOME_DAYS (Set<number>).
      Middle: dayDiff = floor((ymd(today) - ymd(SCHEDULE_START)) / 86400000);
              cycleDay = dayDiff % 14; home = KIDS_HOME_DAYS.has(cycleDay).
      Target: updateCustodyBadge() sets custody_status_card + renderTodayChores().
      Refresh: setInterval(updateCustodyBadge, 60000).
    relates_to:
      ui_components: [custody_status_card, ui_top_bar]
      elements: [parenting_schedule_anchor, parenting_home_days,
                 next_custody_transition, chore_daily_view]
    notes: >
      Home = true gates all chore and reward computations for the current day.
      Away = true: chore card shows "Kids at Mom's today" message.

  - id: next_custody_transition
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:date
    ui_display_name: "Back to Dad's Fri Aug 1"
    source: custody_status + parenting_schedule_anchor + parenting_home_days
    rendering:
      semantic: "Back to Dad's Fri Aug 1 / Back to Mom's Thu Jul 31"
      systems: Next Custody Change Date
      technical: computed in updateCustodyBadge() loop over addDays(today, i)
      compliance: Next Scheduled Transition
    definition: >
      The next calendar date on which custody changes from the current state
      (home→away or away→home). Displayed in the custody_status_card below
      the current state label. Scanned forward up to 14 days from today.
    relationships:
      - target: custody_status
        type: derives_from
        cardinality: "N:1"
      - target: parenting_schedule_anchor
        type: derives_from
        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
      - target: custody_status_card
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      for i in 1..14: if isKidsHome(addDays(today, i)) !== home → transition date.
      Target: #custody-next textContent = "Back to {dadName}'s {weekday} {month} {day}".
    relates_to:
      ui_components: [custody_status_card]
      elements: [custody_status, parenting_home_days]

  - id: parenting_schedule_rule_version
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Schedule version"
    source: localStorage["smrekar_schedule_rules"] (array of rule objects)
    rendering:
      semantic: "Schedule effective from {date}"
      systems: Custody Rule Version
      technical: "{ id, effectiveFrom, anchor, dayOwners, label, createdAt, createdBy }"
      compliance: Custody Agreement Version Record
    definition: >
      One version of the 14-day custody rule, effective from a given date
      forward. Supersedes parenting_schedule_anchor + parenting_home_days as
      a single flat value — the schedule is now a list of these, so a change
      to today's pattern never rewrites how past dates are computed.
      dayOwners is an explicit map of all 14 cycle-day indices to 'dad' or
      'mom' (not a "home days" set implying the complement by default) —
      every day's ownership is unambiguous rather than implied.
    relationships:
      - target: parenting_schedule_anchor
        type: replaces
        cardinality: "1:N"
      - target: parenting_home_days
        type: replaces
        cardinality: "1:N"
      - target: custody_day_log
        type: consumed_by
        cardinality: "1:N"
      - target: observation_report
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      ruleForDate(dateKey) returns the latest version whose effectiveFrom
      <= dateKey. Saving in Settings with the same effectiveFrom as the
      current (latest) version amends it in place; a new date pushes a new
      version. Earlier versions are never mutated once superseded.
    relates_to:
      ui_components: [settings_panel, ui_schedule_tab]
      elements: [holiday_override, custody_day_log, observation_report]
    notes: >
      Seeded with two versions on first run: 2026-03-13 (original schedule,
      dad days [0,1,4,5,8,9,12,13]) and 2026-07-27 (50/50 schedule agreed
      2026-07-27, dad days [2,3,4,5,9,10] — Rachel Mon/Tue, Nate Wed/Thu,
      alternating Fri-Sun). A device that only ever saw the pre-versioning
      flat smrekar_schedule_cfg value, or an earlier build of this app that
      stored rules as a `homeDays` array instead of `dayOwners`, migrates
      automatically into the current explicit-map shape via normalizeRule().

  - id: holiday_override
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Holiday / vacation"
    source: localStorage["smrekar_holidays"] (array of holiday objects)
    rendering:
      semantic: "Christmas Day — Dad's"
      systems: Holiday Owner Override
      technical: "{ id, date, name, owner: 'mom'|'dad', createdAt, createdBy }"
      compliance: Custody Exception Record
    definition: >
      A specific calendar date that belongs wholly to one parent regardless
      of what the active schedule rule would otherwise assign — for named
      holidays, school breaks, or agreed vacation days. Any signed-in user
      can add, edit, or delete one from Settings.
    relationships:
      - target: parenting_schedule_rule_version
        type: extends
        cardinality: "N:1"
      - target: custody_day_log
        type: consumed_by
        cardinality: "1:N"
      - target: observation_report
        type: consumed_by
        cardinality: "1:N"
      - target: holiday_history_entry
        type: consumed_by
        cardinality: "1:N"
      - target: upcoming_holidays_view
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      CRUD via openHolidayForm()/saveHoliday()/deleteHoliday(), persisted by
      saveHolidaysState(). ownerOfDate(date) checks holidayForDate(ymd(date))
      first; if present, its owner wins over the rule-computed value for
      that date only. Every add/edit/delete also appends to
      holiday_history_entry via logHolidayChange().
    relates_to:
      ui_components: [settings_panel]
      elements: [parenting_schedule_rule_version, observation_report, holiday_history_entry, upcoming_holidays_view]

  - id: upcoming_holidays_view
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Upcoming Holidays"
    source: holiday_override, filtered to future dates and sorted
    rendering:
      semantic: "Christmas Day — Dec 25, 2026 — Dad's"
      systems: Upcoming Holidays Browser (owner filter + date-range + search)
      technical: "renderUpcomingHolidays() → #upcoming-holidays-scroll innerHTML"
      compliance: Scheduled Custody Exception Report
    definition: >
      A browsing view over holiday_override distinct from the add/edit/
      delete list — every future holiday (date >= today), soonest first,
      filterable by owner (all/Dad's/Mom's), narrowable by date range (3mo/
      6mo/1yr/all future), and searchable by name. Rendered as a
      horizontally scrolling row (soonest on the left) rather than a
      vertical list — a deliberate "magazine, left to right" layout choice.
    relationships:
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
    transformation: >
      Recomputed on every filter change: HOLIDAYS.filter(date >= today,
      within range, matches owner, matches search).sort(date ascending).
      No separate storage — always derived live from holiday_override, never
      goes stale relative to it.
    relates_to:
      ui_components: [settings_panel]
      elements: [holiday_override]

  - id: holiday_history_entry
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Holiday change history"
    source: localStorage["smrekar_holidays_history"] (append-only array)
    rendering:
      semantic: "Added \"Christmas Day\" (2026-12-25, Dad's) — 2026-07-30"
      systems: Holiday Audit Entry
      technical: "{ ts, action: 'add'|'edit'|'delete', id, date, name, owner, prevDate?, prevName?, prevOwner?, changedBy }"
      compliance: Custody Exception Change Record
    definition: >
      One append-only log entry per add/edit/delete of a holiday_override,
      timestamped and attributed to whichever signed-in user made the
      change — same pattern as reward_history_entry. Visible in the
      Holidays section's "Show History" toggle, most recent first, capped
      to the last 25 shown.
    relationships:
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
    transformation: >
      logHolidayChange(action, holiday, prev) appends one entry per
      saveHoliday()/deleteHoliday() call; never mutated or pruned once written.
    relates_to:
      ui_components: [settings_panel]
      elements: [holiday_override]

  - id: theme_preference
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: used
    first_used:
      date: "2026-07-26"
      ref: >
        CLAUDE.md's 2026-07-26 "Current feature state" log lists
        "ThemeProvider — 7 presets" as already shipped by that date — the
        earliest citable evidence of this concept actually being live, not
        this ontology entry's own 2026-07-31 add date (see this entry's
        own notes: the entry was added retroactively for an
        already-existing feature, so the ontology-entry date and the
        concept's real first-used date are deliberately NOT the same here
        — exactly the distinction this field exists to capture).
    data_class: raw
    data_type: xsd:string
    constraint:
      enum: "deepspace | modern | lcars | monolith | retrocrt | bluefin | madscience | neon80s | pacman"
    ui_display_name: "Theme"
    source: localStorage["cabin-theme"]
    rendering:
      semantic: "e.g. \"80s Neon\" or \"Pac-Man\""
      systems: Display Theme Selection
      technical: "THEME_KEY; THEMES[id] → { vars: {CSS custom properties}, fonts: [] }"
      compliance: (not shown)
    definition: >
      Which visual theme is active — a full palette + font-pair swap via CSS
      custom properties (--night, --glass, --gold, --teal, --rose, --cream,
      --radius, --font-display, --font-ui), applied by setting them on
      document.documentElement and a data-theme attribute some theme-specific
      CSS (e.g. Pac-Man's flashing calendar dots) hooks off of. Per-device —
      not synced, same as every other localStorage-backed preference here.
    transformation: >
      applyTheme(id) sets each var via root.style.setProperty(), sets
      root.dataset.theme = id, loads/unloads that theme's Google Fonts link
      tags, and persists to localStorage. renderThemeGrid() reflects the
      active choice in Settings.
    relates_to:
      ui_components: [settings_panel]
      elements: []
    notes: >
      8 presets as of 2026-07-31, added incrementally across sessions:
      deepspace (default), modern, lcars, monolith, retrocrt, bluefin,
      madscience, neon80s ("80s Neon" — magenta/cyan/yellow, Monoton +
      Orbitron, sharp 2px radius), pacman ("Pac-Man" — black/yellow/blue/red,
      Press Start 2P + VT323, 16px radius, animated flashing .ev-pip dots
      scoped to [data-theme="pacman"]). No ontology entry existed for this
      system before 2026-07-31 despite 6 presets already shipped — added
      retroactively per the "ontology is canonical, not optional" directive.

      FOUND 2026-08-07: this entry describes one theme catalog, but there are
      actually TWO hand-duplicated copies of it — family-hub.html's THEMES
      object (9 presets, matches this entry's enum) and cabin-ui's
      ThemeProvider.jsx THEMES object, which only has 7: it's missing
      neon80s and pacman entirely. `source: localStorage["cabin-theme"]` is
      also per-app, not shared, despite the identical key name — the two
      apps live on different subdomains (hub./cabin.unicornpingpong.com)
      and browser localStorage is origin-scoped, so a matching key name
      shares nothing across them. FIXED (partial) same session: every
      cross-app link-out (family-hub's "How's the cabin?" button, cabin-ui's
      "Open Family Hub" button) now appends `?theme=<id>` to the destination
      URL, and both apps' theme-init logic reads that param on load before
      falling back to their own localStorage — so the *active* theme choice
      now genuinely carries over on navigation. FIXED (same session,
      later): the neon80s/pacman drift itself is closed — both apps now
      define the same 9 theme ids, palette-translated into each app's own
      CSS var naming scheme (not byte-identical, since cabin-ui and
      family-hub.html use different variable sets entirely). A new
      `ThemeCatalogDrift.test.jsx` (cabin-ui's Vitest suite) extracts both
      files' theme id sets and fails the build if they diverge again —
      CI-gated (`deploy-family-hub.yml`'s "Validate cabin-ui" step; that
      step's Docker build context was changed to the repo root
      specifically so this test can reach family-hub.html inside the
      image). STILL NOT fixed: the two THEMES objects are still
      hand-duplicated, not a single shared source — this closes the
      symptom (catalogs match, re-drifting is now caught) not the
      duplication itself. See
      `docs/EXECUTION_PLAN_2026-08-07_template-theme-camera.md` §2c/2d for
      the still-open shared-source work.

  - id: family_hub_access_log
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    constraint:
      description: visible/exportable only to accounts in the host-configured admin list
    ui_display_name: "Access Log (admin only)"
    source: localStorage["smrekar_access_log"], gated by ADMIN_EMAILS
    rendering:
      semantic: "First accessed / last seen / total time per family member"
      systems: Family Hub Access Log
      technical: "ACCESS_LOG_KEY; startAccessSession()/touchAccessSession() write, isAdminUser() gates read"
      compliance: Per-User Session Activity Record
    definition: >
      First-seen timestamp + session duration per signed-in Google account,
      visible and JSON-exportable only to accounts in ADMIN_EMAILS. Distinct
      from audit_log (a Postgres-backed device-command/state-change record
      on the cabin-backend) — this is client-side, Family Hub-specific, and
      per-browser (not yet synced — same cross-device gap as everything
      else in localStorage, see chore_completion_state's notes).
    relationships:
      - target: current_actor
        type: complements
        cardinality: "N:N"
    relates_to:
      ui_components: [settings_panel]
      elements: []
    notes: >
      ADMIN_EMAILS was a hardcoded array in family-hub.html source
      (nhsmrekar@gmail.com only) until 2026-08-01 — meant a template fork
