# ═══════════════════════════════════════════════════════════════════════════
# ACTION ELEMENTS
# Controllable behaviors and their constraints
# ═══════════════════════════════════════════════════════════════════════════

  - id: device_command
    entity_type: owl:Class
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    constraint:
      description: "{command: string, payload: object}; must route through HA adapter, not direct Z2M"
    ui_display_name: "Sound alarm"
    rendering:
      semantic: Action (e.g. "Sound alarm", "Lock door")
      systems: Device Command
      technical: POST /api/devices/{deviceId}/command {command, payload}
      compliance: Recorded Action
    definition: >
      A user-initiated instruction sent to a physical device via the
      FaceoftheCabin backend, routed through Home Assistant for execution,
      logging, and automation awareness.
    relationships:
      - target: fotc_device_id
        type: depends_on
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
      - target: action_confirmation_copy
        type: consumed_by
        cardinality: "1:1"
    notes: >
      All commands route through HA adapter — not direct Z2M MQTT.
      This ensures HA automations are aware of manual commands and can
      respond (e.g. don't re-trigger alarm if user just silenced it).
      Every command execution is written to audit_log with timestamp,
      user context, command, payload, and HA response status.

  - id: action_confirmation_copy
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      description: required for all irreversible, safety-relevant, or liability-class actions
    ui_display_name: "Confirmation message"
    rendering:
      semantic: Confirmation message before irreversible action
      systems: Confirmation Dialog
      technical: confirmation prop on ActionButton component
      compliance: Required pre-action disclosure
    definition: >
      Plain-language consequence description shown to the user before any
      action that is irreversible, safety-relevant, or has liability
      implications. Required for: silence alarm, bypass sensor, unlock door.
    relationships:
      - target: device_command
        type: derives_from
        cardinality: "N:1"
    notes: >
      Examples:
        Silence leak alarm: "Silencing this alarm means water damage may
        go undetected. The sensor will not alert again until re-armed."
        Unlock door: "This will unlock the front door remotely. Confirm
        you intend to grant access."
      Must be present on all destructive/safety actions. Non-negotiable
      per adjuster feedback from user test group session 2026-07-26.

  - id: audit_log
    entity_type: owl:Class
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    constraint:
      description: append-only; no update or delete permitted; immutable record
    ui_display_name: "Activity history"
    rendering:
      semantic: Activity history
      systems: Audit Log
      technical: device_audit_log table (Postgres)
      compliance: Action Evidence Record
    definition: >
      Append-only timestamped record of every device command, alert trigger,
      sensor state change, and system event. The compliance and liability
      record of platform activity.
    relationships:
      - target: device_command
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: derives_from
        cardinality: "N:1"
    notes: >
      Promoted from Phase 2 to core requirement per adjuster and analyst
      feedback (user test group session 2026-07-26). Must be present when
      device command endpoint ships. Immutable — no delete or update,
      append only.

