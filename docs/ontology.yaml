    relates_to:
      ui_components: [] # recording itself is on; a browsable DTM timeline/scrubber UI is still a separate, unbuilt piece -- CameraEventsPanel only shows event-anchored clips + live view, not the full continuous timeline
      elements: [cabin_camera_event, cabin_camera_event_clip]
    notes: >
      BUILT 2026-08-02 (later the same day as the original planning
      entry below, once the user confirmed they wanted to proceed):
      record.continuous.days set to 5 in /storage/services/frigate/config.yml
      (backed up first — this file still has zero git history, see the
      CabinAutomations blocker in docs/DEFINITION_OF_DONE.md). 5 days was
      a deliberate, conservative choice made directly with the user, not
      the 14-30 day range this entity originally floated below: driveway's
      record role uses its 4K main stream (confirmed via the live camera
      config's own comment), which at realistic 4K bitrates could
      plausibly hit 80-160+ GB/day once that camera reconnects (currently
      off-network, so not consuming space yet) — against 826GB free
      (confirmed via `df -h` immediately before the change), a 14-30 day
      window at that rate was a real risk of filling a disk other
      services (Postgres, HA, Node-RED) also depend on. Re-measure real
      GB/day once driveway reconnects and extend retention only after
      confirming actual usage. Frigate restarted cleanly after the
      change (confirmed healthy, config re-fetched via GET /api/config
      showing continuous.days: 5.0) — one pre-existing, unrelated issue
      surfaced during that verification: outdoor_4 (Blink) was already
      crash-looping on 404s from mediamtx hours before this change
      (confirmed via logs from 18:00, well before the 22:10 restart) —
      not a regression from this work, but a real, separate gap worth a
      follow-up (blinkbridge's stream isn't reliably available even
      when idle, not just "motion-gated" as originally understood).

      ORIGINAL PLANNING NOTE (2026-08-02, earlier the same day, kept for
      the record): Confirmed live via Frigate's own GET /api/config (the
      actual running merged config, not the checked-in template, which
      can drift from it — see cabin_camera_event's notes on the two files
      having already drifted once): record.continuous.days was 0.0
      globally AND per-camera for outdoor_4 — meaning despite
      record.enabled: true, nothing was actually being retained. Storage
      headroom confirmed via `df -h`: /storage is 931.5GB (/dev/sda1),
      826GB free, 5% used — healthy, but the actual GB/day cost depends
      on real motion levels per camera and hadn't been measured yet.
      VAAPI hardware encoding is already configured
      (ffmpeg.hwaccel_args: preset-vaapi), which helps the CPU cost of
      this.

  - id: cabin_camera_event_clip
    entity_type: owl:Class
    layer: infra
    primitive: false
    schema_version: "0.1.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:complexType
    constraint:
      description: >
        bounded clip anchored to a cabin_camera_event's start/end time,
        pre_capture seconds before + post_capture seconds after; stored
        alongside continuous recording under the same Frigate media path
    ui_display_name: "Event Clip"
    source: >
      Frigate's record.alerts / record.detections config (pre_capture,
      post_capture, retain.days) — same config file as
      cabin_camera_continuous_recording. Served through cabin-backend's
      CameraMediaController, which proxies Frigate's real
      GET /events/{event_id}/{snapshot.jpg,clip.mp4} endpoints (confirmed
      by reading frigate/api/media.py's route decorators directly on the
      M920q, not assumed).
    rendering:
      semantic: "Video clip: <camera> — <label>, 15s before to 60s after"
      systems: Event-Anchored Recording
      technical: "Frigate record.alerts/detections.{pre_capture:15,post_capture:60,retain.days:10} (both tiers, changed from the 5s/5s default 2026-08-02); GET /api/camera/events/{frigateEventId}/{snapshot,clip} on cabin-backend, Google-auth-gated"
      compliance: Event-Triggered Video Retention Record
    definition: >
      A trimmed video clip automatically created around a single detection
      event — NOT the same as cabin_camera_continuous_recording (which is
      unedited, always-on footage). This is what "(b) stores video of the
      events minus 15 seconds and post event of one minute" in the
      2026-08-02 planning conversation refers to.
    relationships:
      - target: cabin_camera_event
        type: extends
        cardinality: "1:1"
      - target: cabin_camera_continuous_recording
        type: complements
        cardinality: "N:1"
    relates_to:
      ui_components: [ui_camera_events_panel]
      elements: [cabin_camera_event]
    notes: >
      BUILT 2026-08-02 (later the same day as the original planning entry
      below). Both storage (pre_capture/post_capture widened to 15/60,
      both review tiers — applied to both rather than picking just
      "alerts," the open decision this entity originally flagged) and
      viewing are now real: MqttBridgeService.handleFrigateDetectionEvent()
      was found NOT capturing Frigate's own event id (after.id) at all —
      a real gap that meant, even with clips being stored, there was no
      way to ever fetch a specific one. Fixed: now captures frigateEventId
      plus hasSnapshot/hasClip flags into the CabinEvent payload.
      cabin-ui's CameraEventsPanel fetches the snapshot as an
      authenticated blob (Authorization header — <img>/<video> tags can't
      set custom headers, but a JS fetch() can) for a thumbnail per event,
      and expands to a <video> clip player on click, same blob-fetch
      pattern. Backend reaches Frigate directly by Docker hostname
      (cabin-backend confirmed already on the cabin_default network via
      `docker inspect`, alongside its own infra_default) rather than
      exposing Frigate itself. Verified: backend compiles clean, frontend
      builds clean, both deployed and live, auth gate confirmed (401
      without a token). NOT yet verified: a real signed-in browser
      session actually rendering a thumbnail/clip end to end — no
      recent qualifying event existed to test against at deploy time
      (outdoor_4 hadn't detected anything in hours; see
      cabin_camera_continuous_recording's notes on its ongoing
      mediamtx 404 issue). Needs a real test once a fresh event exists.

      CORS PREFLIGHT BUG, found and fixed 2026-08-03 (see
      docs/DEFINITION_OF_DONE.md's FOURTH CHECK-IN): this is very likely
      *why* the real-browser test above hadn't succeeded —
      GoogleAuthInterceptor rejected every CORS preflight OPTIONS request
      to /api/camera/** with 401, since it checked for a Bearer token on
      OPTIONS the same as any other method — a preflight never carries
      one. curl-based testing never caught it, since curl doesn't enforce
      the browser rule that a preflight response itself must be a plain
      2xx. Fixed by exempting OPTIONS from the token check entirely.

      DTM STAMP added 2026-08-07 (user-reported: unsure when Blink
      notifications were from): CameraEventThumbnail now renders a
      timestamp overlay directly on the thumbnail image itself (bottom
      edge, semi-transparent badge), not just as separate list text next
      to it — using CabinEvent.timestamp, already returned by /api/events,
      no backend change. NOT verified: whether Frigate's own snapshot
      already burns in a timestamp server-side, which would make this
      overlay redundant — needs checking against the live M920q's actual
      Frigate config/output, not assumed; see
      docs/EXECUTION_PLAN_2026-08-07_template-theme-camera.md §4b.

      ORIGINAL PLANNING NOTE (2026-08-02, earlier the same day, kept for
      the record): Current live values were pre_capture=5, post_capture=5,
      retain.days=10 for both review tiers. Open decision: change both
      tiers to 15/60, or only "alerts" — resolved above (both).
      cabin_camera_event (the metadata record) didn't reference this
      entity at all yet — Phase 2's pipeline only ever carried
      camera/label/score/timestamp, no clip/image reference, by
      deliberate scope decision at the time.

  - id: cabin_camera_live_view
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.1.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:complexType
    constraint:
      description: >
        on-demand streaming session, not itself persisted — the underlying
        video is retained via cabin_camera_continuous_recording, not a
        separate save-on-view mechanism
    ui_display_name: "Live Camera View"
    source: >
      Frigate's plain MJPEG live endpoint, GET /api/{camera_name}
      (frigate/api/media.py's mjpeg_feed route, confirmed by reading the
      source directly on the M920q) — simpler than the MSE/jsmpeg/go2rtc
      mechanism originally assumed below, and needs no extra go2rtc
      config. Proxied through cabin-backend's CameraMediaController
      rather than exposing Frigate directly.
    rendering:
      semantic: "Live view: <camera>"
      systems: On-Demand Live Stream
      technical: "GET /api/camera/{cameraName}/live on cabin-backend, streamed through via Java's HttpClient + Spring's StreamingResponseBody; rendered client-side as a plain <img> tag (the standard way browsers consume multipart/x-mixed-replace, no player library needed)"
      compliance: Live Video Access Record
    definition: >
      An on-demand live video session for one camera, viewable through
      cabin-ui — the "(a) live view that acts like Blink" requirement from
      the 2026-08-02 planning conversation. Unlike Blink's cloud-clip
      model (which explicitly starts recording when you open live view),
      this does NOT need its own capture-trigger mechanism: once
      cabin_camera_continuous_recording is enabled or a
      cabin_camera_event_clip already covers the event, "what did I just
      watch" is already retained and reviewable — live view here is a
      viewing session only.
    relationships:
      - target: cabin_camera_continuous_recording
        type: depends_on
        cardinality: "N:1" # "the session gets stored" is satisfied by this being on, not by live_view itself
    relates_to:
      ui_components: [ui_camera_events_panel]
      elements: [cabin_camera_continuous_recording]
    notes: >
      BUILT 2026-08-02 (later the same day as the original planning entry
      below). CameraEventsPanel offers a "watch live" button per camera.

      BUG FOUND AND FIXED, 2026-08-02, same evening: the button list was
      originally derived from event history's sourceDeviceId (a known
      simplification at build time — "no dedicated camera-list endpoint
      exists yet"). That simplification broke for real the moment the
      cameras got renamed a few hours later (see cabin_camera_event's
      rename note): historical events keep their old sourceDeviceId
      forever by design, but Frigate itself only recognizes the new
      names, so the button proxied to a camera Frigate no longer had —
      broken image icon, caught by the user actually testing it live.
      Fixed at the root: new GET /api/camera/list on cabin-backend parses
      Frigate's own GET /api/config directly for the real, current camera
      names + enabled state — no longer derived from anything historical.

      Auth is the other genuinely tricky part here, worth recording:
      /api/camera/** requires a Google bearer token, but an <img> tag
      can't set custom headers, and this MJPEG stream is unbounded so it
      can't be blob-fetched the way snapshot/clip (finite) can be —
      GoogleAuthInterceptor now also accepts the token as an
      ?access_token= query param specifically for this case, same
      validation either way. Verified: backend/frontend both compile and
      deploy clean, auth gate confirmed. NOT yet verified: an actual
      signed-in browser session watching a real live stream render —
      needs a real test, and ideally with driveway or front_door
      reconnected too, not just outdoor_4 (which is currently
      crash-looping on mediamtx 404s — see
      cabin_camera_continuous_recording's notes).

      CORS PREFLIGHT BUG, found and fixed 2026-08-03 (see
      docs/DEFINITION_OF_DONE.md's FOURTH CHECK-IN): this is very likely
      *why* the real-browser test above hadn't succeeded, for the query-
      param path too — GoogleAuthInterceptor rejected every CORS
      preflight OPTIONS request to /api/camera/** with 401, since it
      checked for a Bearer token on OPTIONS the same as any other method
      — a preflight never carries one, regardless of whether the real
      request would use the header or query-param transport. curl-based
      testing never caught it, since curl doesn't enforce the browser
      rule that a preflight response itself must be a plain 2xx. Fixed
      by exempting OPTIONS from the token check entirely.

      ORIGINAL PLANNING NOTE (2026-08-02, earlier the same day, kept for
      the record): key architectural point recorded here so it isn't
      relitigated later: a Blink-style "recording starts when you open
      the app" trigger is unnecessary complexity for an always-on NVR
      setup like Frigate's — it only makes sense for Blink because Blink
      cameras are otherwise idle/cloud-only. Once
      cabin_camera_continuous_recording is turned on, every live-view
      session is already covered by the continuous timeline with zero
      extra work (now true — continuous recording shipped the same day,
      see that entity's notes). go2rtc was assumed as the likely
      mechanism at planning time; the actual build used Frigate's plain
      MJPEG endpoint instead, simpler and needing no extra config — see
      `source` above.

      REAL BLINK LIVEVIEW ADDED 2026-08-03: the assumption above --
      "always-on NVR, no per-view trigger needed" -- turned out to be
      wrong specifically for the Blink camera (camera_role_driveway,
      formerly camera_driveway_blink before the 2026-08-07 hardware/role
      split). Its feed was never
      truly live: blinkbridge only republishes Blink's motion-triggered
      clips on a loop, so "watch live" during the day could show a
      frozen frame from the last nighttime motion event, hours stale
      (found via user report: "camera view is still nighttime and it's
      daytime now"). Fixed by adding a real, on-demand liveview path:
      cabin-ui's watch-live button now calls POST
      /api/camera/{cameraName}/liveview/start (CameraMediaController),
      which -- only for cameras listed in
      cabin.devices.cameras.blinkCameraMap -- calls blinkbridge's own
      new liveview control API, which opens a genuine blinkpy
      BlinkLiveStream session with Blink's cloud and relays it into the
      same mediamtx path Frigate already reads from, replacing the
      motion-clip loop for the session's duration only (on-demand, not
      always-on -- explicit user decision, since Blink battery cameras
      aren't built for continuous streaming). Confirmed working against
      the real camera: a snapshot pulled from Frigate mid-session showed
      genuine current daylight footage, not a cached clip. Session auto-
      falls-back to the motion loop if Blink's own liveview server ends
      it early (observed happening twice during testing) or after a 5-
      minute hard cap if nothing ever calls .../liveview/stop.

      Found and fixed a real bug in the third-party `blinkpy` library
      while building this: `BlinkLiveStream.recv()` reads its protocol
      header/payload with `StreamReader.read(n)`, which asyncio does not
      guarantee returns exactly `n` bytes -- reliably killed every
      liveview session within a few seconds on a real network
      connection. Confirmed present in blinkpy 0.25.7 (installed) and
      0.25.9 (latest on PyPI at the time) -- not something upgrading
      would have fixed. Patched at runtime (readexactly() instead of
      read()) via a small monkey-patch in blinkbridge's own source
      rather than forking blinkpy — see MAINTENANCE.md's Cameras section
      for exactly where.

  - id: cabin_camera_overnight_alert
    entity_type: owl:Class
    layer: integration
    primitive: false
    schema_version: "0.1.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:complexType
    constraint:
      description: >
        gated on armed-away + not-home state (reuses the same MQTT-published
        state cabin-security's intrusion flow already tracks) plus a 5-minute
        cooldown; only fires for alert-tier labels, not every detection
    ui_display_name: "Overnight Camera Alert"
    source: >
      New Node-RED tab ("Camera Overnight Alerts"), added 2026-08-03 via
      Node-RED's Admin API (POST /flow, then PUT /flow/:id for iteration)
      rather than hand-editing flows.json directly — the user was
      concurrently editing a separate flow (the water-shutoff automation)
      live in the Node-RED UI at the time, so a file-level edit risked
      losing their in-progress work or getting silently overwritten by the
      editor's own autosave.
    rendering:
      semantic: "Cabin Alert: <label> at <camera>"
      systems: Overnight Security Push Notification
      technical: "MQTT cabin/camera/events -> Node-RED function chain -> HTTP POST to ntfy.sh/{private topic}"
      compliance: Security Alert Delivery Record
    definition: >
      A push notification sent when Frigate detects an alert-tier object
      (person, car, bicycle, motorcycle, bus, bear, dog, or cat — see
      cabin_camera_event's objects.track/review.alerts.labels config)
      while the cabin is armed-away and the user isn't present. Answers
      the user's explicit ask: "I know I'll get an alert if someone is
      stealing something right in front of the cabin overnight."
    relationships:
      - target: cabin_camera_event
        type: depends_on
        cardinality: "N:1"
      - target: platform_secret
        type: depends_on
        cardinality: "1:1" # the ntfy.sh topic name functions as a shared secret -- anyone who knows it can read the channel, since ntfy.sh topics aren't access-controlled by default
    relates_to:
      ui_components: []
      elements: [cabin_camera_event]
    notes: >
      BUILT 2026-08-03. Delivery mechanism: ntfy.sh (free, no account,
      no app-pairing needed) chosen over Home Assistant's Companion App
      push notifications specifically because no mobile_app config entry
      existed yet (confirmed via HA's own .storage/core.config_entries —
      the Companion App has never been paired to this HA instance), and
      pairing it would need Tailscale on the user's phone or another
      remote-access path first. ntfy.sh needed only an app install and a
      topic subscription — no account, no pairing — so it could ship the
      same night.

      Gating deliberately reuses the SAME MQTT-published state the
      existing cabin-security intrusion flow already tracks
      (cabin/security/armed_away, cabin/presence/nate) rather than
      inventing new logic — subscribed independently in this new tab
      rather than sharing Node-RED flow-context directly, since flow
      context is tab-scoped by default and these are two separate tabs;
      MQTT pub/sub is the intentional decoupling point, matching how the
      existing flow was already designed to be consumable by other flows.

      REAL BUG FOUND AND FIXED during a live test, worth recording:
      immediately after deploying via the Admin API, the "remember armed
      state" / "remember presence" function nodes hadn't yet received
      their retained MQTT messages, so flow.get('armedAway') and
      flow.get('natePresence') both read undefined and the very first
      test detection was incorrectly gated out. Confirmed via node.warn()
      tracing (node.status() alone isn't visible outside the Node-RED
      UI) that the MQTT subscriptions themselves worked fine against a
      FRESH publish — this was specifically a retained-message-delivery
      timing gap right after a partial Admin-API deploy, not a broken
      subscription. Self-resolves in practice within a minute or two of
      Node-RED being up, since the WiFi-presence automation
      (cabin_security_presence.yaml's command_line binary_sensor, added
      earlier this session) publishes cabin/presence/nate every 60s
      regardless, but worth knowing about if a deploy is ever tested
      immediately afterward again.

      MUCH BIGGER BUG FOUND (and fixed), 2026-08-07 — the "known gap"
      that used to sit here undersold what was actually wrong. This
      entry's own `mqtt in` node (`cam-alert-armed-in`) and the
      intrusion flow's equivalent (`armed-in`) were both subscribed to
      `cabin/security/node_red_armed` — a topic HA's `cabin_security.yaml`
      package has *never once published to*. The real, live, retained
      topic HA actually publishes is `cabin/security/armed_away`. This
      wasn't "no ongoing publisher, running on a stale one-off value" as
      previously written — it was two topic strings that never matched,
      meaning toggling the real HA arm/disarm switch has never reached
      either Node-RED flow, ever, since this was built. Fixed by
      repointing both nodes to `cabin/security/armed_away` (Admin API,
      full-flow POST, topic field only). Verified via a fresh GET /flows
      showing the corrected topic on both nodes, plus a live retained
      `OFF` value confirmed present on it. No extra heartbeat/polling
      added — armed-state republishes on toggle and on HA restart, which
      is sufficient now that both consumers read the topic that's
      actually live. See MAINTENANCE.md's Overnight Camera Alerts section
      for the full incident writeup, and `docs/DEFINITION_OF_DONE.md`'s
      "reconcile drift immediately" principle this was a direct example
      of — this bug was found by checking a documentation claim against
      the real Node-RED flow JSON, not by trusting what was already
      written here.

      SEPARATE ISSUE found the same session — FIXED 2026-08-07: this
      entry's own `technical` rendering above claimed delivery goes "to
      ntfy.sh/{private topic}" and `cabin_critical_event_alert`
      (cabin-backend's equivalent CRITICAL-severity push) claimed to
      reuse "the same" topic. Checked by hash comparison, not assumed:
      they were genuinely different topics — this flow's `cam-alert-
      ntfy-out` node had the old topic hardcoded directly in its `url`
      field (not a template, a literal string). The user confirmed they
      have exactly one topic subscribed in the ntfy app, and it's the
      one cabin-backend already uses (confirmed by a real received push
      earlier the same session) — so this flow was the one that needed
      to change, not the backend. Fixed via Node-RED's Admin API (full-
      flow POST, `url` field only), value read from
      infra/.env's CABIN_ALERT_NTFY_TOPIC on the M920q and never printed
      anywhere in the process. Verified by SHA-256 hash comparison
      between the deployed node's URL and the backend's own configured
      topic: identical. Both producers now push to the same real,
      subscribed topic.

      Verified end-to-end with real MQTT test events (not just code
      review): a "person at front_door" test correctly passed every gate
      and produced a real ntfy.sh push (confirmed via ntfy's own message
      API showing the delivered notification); a second "dog at
      driveway" test 30s later was correctly suppressed by the 5-minute
      cooldown (confirmed via the same API showing no new message).
      "Truck" was requested but is not a valid label for the currently
      loaded default detection model (confirmed via its real labelmap.txt
      — no distinct truck class exists in this model's label set, only
      car/bus/motorcycle/bicycle for vehicles) — flagged to the user
      directly rather than silently dropped without explanation.

  - id: cabin_critical_event_alert
    entity_type: owl:Class
    layer: backend
    primitive: false
    schema_version: "0.1.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:complexType
    constraint:
      description: >
        Fires only for event_severity == CRITICAL. WARN-tier events
        (door open, low battery, tamper) are deliberately not pushed --
        see event_severity's own notes for why.
    ui_display_name: "Critical Event Alert"
    source: >
      NtfyAlertPublisher.java, added 2026-08-06 alongside
      AlertSeverityClassifier -- triggered from EventConsumer right after
      a CRITICAL-severity CabinEvent is persisted to Postgres, so the
      push and the durable record are the same code path, not two
      separately-maintained ones.
    rendering:
      semantic: "Cabin Alert: <device>: <what happened>"
      systems: Critical Event Push Notification
      technical: "Kafka cabin.events.raw -> EventConsumer -> CabinEventService.save() -> NtfyAlertPublisher.publishIfCritical() -> HTTP POST to {ntfyBaseUrl}/{topic}"
      compliance: Critical Alert Delivery Record
    definition: >
      A push notification sent for any CabinEvent classified CRITICAL by
      AlertSeverityClassifier (water_leak, smoke, or alarm == true) --
      not camera/object-detection specific like cabin_camera_overnight_alert,
      this is the general-purpose path for Zigbee sensors and any other
      MQTT-sourced device event.
    relationships:
      - target: event_severity
        type: depends_on
        cardinality: "N:1"
      - target: platform_secret
        type: depends_on
        cardinality: "1:1" # CABIN_ALERT_NTFY_TOPIC functions as a shared secret, same reasoning as cabin_camera_overnight_alert's topic
      - target: cabin_camera_overnight_alert
        type: complements
        cardinality: "N:N" # same delivery mechanism (ntfy.sh), deliberately the SAME topic reused rather than a second subscription -- see notes
    relates_to:
      ui_components: []
      elements: [event_severity]
    notes: >
      BUILT 2026-08-06. Deliberately reuses the exact same ntfy.sh topic
      cabin_camera_overnight_alert already established, rather than
      creating a second subscription the user would need to add in the
      ntfy app -- one topic, two independent producers (Node-RED for
      camera-tier alerts, cabin-backend for device-tier CRITICAL events).

      CORRECTION, 2026-08-07: that claim was written as fact when this
      entity was built but never actually verified — it was false until
      fixed the same day this was caught. See
      cabin_camera_overnight_alert's notes for the real incident (Node-
      RED had a different, stale topic hardcoded directly in an http
      request node's URL field) and the fix (repointed Node-RED to this
      entity's topic, confirmed identical by SHA-256 hash comparison
      after deploy). Both producers genuinely share one topic now.

      Config: cabin.alerts.ntfyTopic / CABIN_ALERT_NTFY_TOPIC env var,
      empty by default (CRITICAL events still persist to cabin_event,
      just no push -- matches this codebase's established pattern for
      optional integrations, e.g. CameraMediaController's blinkBridgeUrl).
      Real value lives only in infra/.env on the M920q, never committed --
      same shared-secret reasoning as cabin_camera_overnight_alert's topic.

      Unlike cabin_camera_overnight_alert, this entity is NOT gated on
      armed/presence state -- a CRITICAL event (active water leak, smoke)
      pages regardless of whether anyone's home or the cabin is armed,
      since those conditions matter for security-tier alerts but not for
      "something is actively leaking or on fire" ones. This is a
      deliberate difference from the camera alert's gating, not an
      oversight -- worth remembering if the two entities' gating logic is
      ever compared and looks inconsistent at a glance.

      Verified end-to-end with a real synthetic event (not just code
      review): a manually published cabin/event/critical MQTT message
      produced a CabinEvent with severity: "CRITICAL" in /api/events AND
      a real ntfy push, confirmed received on the user's phone.

