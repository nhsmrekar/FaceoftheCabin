  - id: platform_secret
    entity_type: owl:Class
    layer: infra
    primitive: false
    schema_version: "0.1.0"
    migration_status: partial
    data_class: raw
    data_type: xsd:string
    constraint:
      description: >
        secret VALUES never committed to git in plaintext; live encrypted in
        ansible/group_vars/{group}/vault.yml (safe to commit — that's the
        point of Vault) and get templated into each host's infra/.env
        (gitignored, plaintext, generated — not hand-edited) by the
        ansible/roles/secrets role
    ui_display_name: "(not shown — operator-only concept)"
    source: >
      ansible/group_vars/{cabin,home}/vault.yml (Ansible Vault-encrypted),
      templated into infra/.env by ansible/roles/secrets — see
      ansible/README.md's Secrets section
    rendering:
      semantic: (not shown)
      systems: Platform Secret / Credential
      technical: environment variable, read via docker-compose interpolation
        and/or a service's own config (Spring's ${VAR:-default}, family-hub's
        Dockerfile ARG)
      compliance: Credential Record
    definition: >
      Any password, token, or client secret one platform component needs to
      authenticate to another — POSTGRES_PASSWORD, GRAFANA_PASSWORD,
      HA_TOKEN, GOOGLE_CLIENT_ID (public, not secret, but host-scoped the
      same way), the GitHub Actions runner registration token, etc. Modeled
      as one entity because they share the same lifecycle problem —
      generation, storage, rotation, and which device/service consumes
      which value — regardless of which specific credential it is.
    relationships:
      - target: machine_hostname
        type: scoped_to
        cardinality: "N:1"
      - target: docker_network_cabin_default
        type: consumed_by
        cardinality: "N:N"
    relates_to:
      ui_components: []
      elements: [machine_hostname, docker_network_cabin_default]
    notes: >
      HISTORY: before 2026-08-02 this was entirely manual — ad hoc
      generation, a hand-maintained plaintext .env per host, rotation done
      by SSHing in and running the change by hand (see the cabin-postgres
      password rotation earlier the same day for exactly what that looked
      like: ALTER USER against the live container, since Postgres only
      applies POSTGRES_PASSWORD at first volume init, then .env updated to
      match, then every dependent service manually recreated).

      BUILT 2026-08-02: ansible/roles/secrets (templates infra/.env from
      vault-sourced vars) and ansible/playbooks/rotate-secrets.yml
      (generates a new POSTGRES_PASSWORD, applies it live via ALTER USER,
      re-encrypts the vault, re-templates .env, recreates cabin-backend +
      cabin-grafana, then validates via cabin-backend's /actuator/health —
      fails loudly via an assert if the new credential doesn't actually
      work, rather than leaving a silent break). Scheduled monthly via
      .github/workflows/rotate-secrets.yml on the self-hosted runner, plus
      workflow_dispatch for an on-demand "rotate now."

      LIVE-VALIDATED 2026-08-02 (later the same day): Ansible installed on
      the M920q via `sudo apt install -y ansible-core` (the pip3 route hits
      PEP 668 on this host — documented as the non-working option in
      ansible/README.md, kept for the record). Ran a real end-to-end
      rotation against the live host: generated a new password, `ALTER
      USER` against cabin-postgres, re-encrypted the vault, re-templated
      .env, recreated cabin-backend + cabin-grafana, validated via
      /actuator/health (db: UP). Confirmed no data loss — event row count
      and oldest timestamp unchanged across the restart (cabin-postgres
      itself was incidentally recreated too, as a side effect of `docker
      compose up` on its dependents; harmless, since POSTGRES_PASSWORD only
      applies at first volume init). Two real bugs found only by actually
      running it, not from reading the YAML: the playbooks/ subdirectory
      broke include_role's default search path for roles/secrets (fixed
      via a new ansible/ansible.cfg), and env.j2's header comment
      referenced a non-existent Ansible magic variable. Both fixed, then
      the rotation was re-run successfully end to end.

      SCOPE: GRAFANA_PASSWORD/HA_TOKEN rotation is NOT built — they need
      different mechanics (Grafana's admin API, HA's own long-lived-token
      UI, not an ALTER USER-equivalent) and are a documented follow-up.
      Also unbuilt: the GitHub Actions runner's own registration token
      (already short-lived/one-time by GitHub's own design, lower priority)
      and Frigate's CAMERA_PASSWORD (currently hardcoded directly in
      /storage/services/frigate/config.yml on the M920q, a file with zero
      git history at all — see the CabinAutomations-repo blocker in
      docs/DEFINITION_OF_DONE.md).

  - id: cabin_camera_event
    entity_type: owl:Class
    layer: backend
    primitive: false
    schema_version: "0.4.0"
    migration_status: complete
    lifecycle_status: used
    first_used:
      date: "2026-08-02"
      ref: "this entry's own \"BUILT 2026-08-02\" note — MqttBridgeService's Frigate camera-topic handling"
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Camera Activity Event"
    source: >
      Frigate (MQTT, cabin/camera/# topics) -> MqttBridgeService ->
      EventPublisher (Kafka topic cabin.events.raw) -> EventConsumer ->
      CabinEventService -> Postgres cabin_event table
    rendering:
      semantic: "<camera> saw <label> (<score>) / motion <on|off> at <camera>"
      systems: Camera Detection/Motion Event
      technical: "CabinEvent(eventId, sourceDeviceId=camera name, eventType=DETECTION_NEW|DETECTION_UPDATE|DETECTION_END|MOTION_ON|MOTION_OFF, severity, timestamp, payload)"
      compliance: Camera Activity Record
    definition: >
      A single motion or object-detection event from a Frigate-managed
      camera, normalized from Frigate's MQTT event stream into the
      platform's own CabinEvent shape. Two distinct topic shapes feed this:
      cabin/camera/events (rich JSON, camera+label+score live inside the
      payload — Frigate's own detection pipeline) and
      cabin/camera/{name}/motion (plain "ON"/"OFF" — a lighter presence
      signal). cabin/camera/available (bridge online/offline) is NOT
      persisted as an event — it doesn't name a camera and isn't itself an
      activity signal.
    relationships:
      - target: platform_secret
        type: depends_on
        cardinality: "N:1" # CAMERA_PASSWORD gates the RTSP source Frigate reads from
    relates_to:
      ui_components: [] # Phase 3/4 (cabin-ui events panel, Family Hub public widget) not yet built
      elements: []
    notes: >
      BUILT 2026-08-02. MqttBridgeService's camera-topic handling was
      rewritten in the same pass — the previous version JSON-parsed every
      cabin/camera/# payload uniformly and treated whatever followed
      cabin/camera/ as a camera ID, which is wrong for three of Frigate's
      four real topic shapes (available and {name}/motion are plain text,
      not JSON; events is flat, not per-camera). Verified against a real
      MQTT publish to the M920q's own mosquitto broker, round-tripped
      through Kafka and Postgres, confirmed via direct SQL query and the
      live API response, not just "no exception was thrown."

      Two unrelated infrastructure bugs were found and fixed getting this
      working, not specific to this feature but blocking it entirely:
      (1) EventController's @RequestParam args had no explicit name=,
      which throws IllegalArgumentException the first time such an
      endpoint is actually invoked without the compiler's -parameters flag
      — added globally to backend/pom.xml, since this silently affected
      every other unnamed @RequestParam in the codebase (e.g.
      DeviceController), just never previously exercised by a real
      request. (2) Kafka's internal __consumer_offsets topic defaults to
      replication factor 3, which silently fails to create on this
      single-broker cluster — no error surfaces anywhere except every
      consumer group hanging forever with zero partitions assigned.
      Fixed via KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 in
      docker-compose.yml — this would have blocked EventConsumer on the
      real M920q too, not just local dev, since it's also single-broker.

      Phase 3 BUILT 2026-08-02: cabin-ui's own standalone Google Sign-In
      (useGoogleAuth() in App.jsx, separate from Family Hub's — reuses the
      same OAuth client via VITE_CABIN_GOOGLE_CLIENT_ID, needs
      cabin.unicornpingpong.com added as an authorized JS origin on that
      client, a manual one-time step) gates a new Camera Events panel.
      /api/events itself stays unauthenticated — this is a client-side
      visibility gate, not a second server-side auth layer, a deliberate
      scope decision to avoid redundant gating. Deep-linkable via
      ?panel=CAMERA_EVENTS; Family Hub's "How's the cabin?" link-out now
      points there directly instead of cabin-ui's default landing panel.
      In the same pass, found and fixed cabin-ui's Dockerfile silently
      dropping VITE_CABIN_HA_URL/VITE_CABIN_Z2M_URL/VITE_CABIN_FAMILY_HUB_URL
      — declared as compose build args but never given matching ARG/ENV
      lines in the Dockerfile, so the deployed app had been using
      hardcoded fallback defaults (a non-resolvable cabin-hub hostname,
      null for the Family Hub link) instead of the real values this whole
      time. Same root-cause shape as GOOGLE_CLIENT_ID/ADMIN_EMAILS going
      missing in family-hub's .env from the secrets-rotation session.

      Phase 4 BUILT 2026-08-02: Family Hub's public, unauthenticated
      near-real-time widget (near the "How's the cabin?" link-out on
      Overview), polling /api/events?limit=1&window=10m every 20s —
      deliberately a live-status snapshot, not a browsable history (that's
      cabin-ui's authenticated panel from Phase 3). User-controlled detail
      level (CFG.cabinActivityDetail: 'full'|'coarse'|'off', Settings ->
      Cabin Camera Activity) exists specifically because this widget is
      visible to anyone looking at the screen, unauthenticated — 'full'
      shows camera/object/time, 'coarse' drops camera+object entirely
      (just "recent activity: yes/no" with a relative time), 'off' hides
      it. A warning is rendered next to the widget itself linking to that
      setting, and README.md carries the same warning prominently. All
      three levels and the warning's visibility toggle verified via a real
      mocked-backend Playwright run, not just read through.

      All four phases of the 2026-08-02 camera-event-pipeline plan are now
      built. The Reolink camera (network-unreachable, needs physical
      checking) is the only remaining gap, and everything here is
      camera-count-agnostic — no code change needed once it's back online.

      CAMERA RENAMED 2026-08-02 (later the same day, during Phase 6):
      Frigate's two real cameras were renamed — the Reolink (was
      "driveway") is now "front_door", and the Blink camera (was
      "outdoor_4") is now "driveway". Both physically sit next to the
      front door and cover the driveway area from different angles; the
      old "front_door" name belonged to a disabled config stanza for a
      camera that was never actually purchased, which caused real
      confusion in a later session before the user clarified it directly.
      One of the two real cameras will eventually be relocated to cover
      the building's rear (no ETA). All references to "outdoor_4" and
      "driveway" elsewhere in this file's historical notes describe what
      was true *at the time they were written* — not retroactively
      updated, since they're an accurate record of that point in time.
      CabinEvent rows already persisted under the old sourceDeviceId
      values ("driveway", "outdoor_4") were NOT migrated — this was a
      deliberate, confirmed decision (a rename creates a new camera
      identity from Frigate's own perspective regardless), so historical
      events keep their original names, only new events use the new ones.

      FOUND 2026-08-07 (user-reported: "under camera views I'm not seeing
      camera events, I'm seeing device inputs"): CameraEventsPanel
      (cabin-ui) called GET /api/events?limit=30&window=24h with no filter
      at all — EventController's `camera` param only scopes to one named
      camera, not "any camera event," so the panel showed every device's
      events (leak/temp/motion sensors included) mixed in with real
      cabin_camera_event rows. FIXED (partial, client-side) same session:
      the panel now filters the response to eventType matching
      DETECTION_*/MOTION_* before rendering. FIXED (fully, same session,
      later): CabinEventService.recent() gained a real eventTypePrefix
      SQL filter (WHERE event_type LIKE 'DETECTION_%' OR ... ) plus
      offset-based pagination, EventController exposes both as query
      params, CameraEventsPanel now requests only camera events directly
      instead of filtering client-side after the fact. Confirmed via a
      live curl against the M920q's currently-deployed (pre-this-session)
      backend that the original unfiltered bug is real — raw Zigbee
      TELEMETRY events came back exactly as this note originally
      described; the fix takes effect once this session's backend changes
      deploy. New CabinEventServiceTest (Testcontainers) covers the
      filter/pagination logic directly.

  - id: cabin_camera_continuous_recording
    entity_type: owl:Class
    layer: infra
    primitive: true
    schema_version: "0.1.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:complexType
    constraint:
      description: >
        stored on the M920q's secondary disk (/storage, /dev/sda1, 931.5GB,
        separate from the boot NVMe — very likely the physical WD drive);
        retention is a configured day count, 5 days as of 2026-08-02
        (was 0 / disabled)
    ui_display_name: "Continuous Recording"
    source: >
      Frigate's own record.continuous config (per-camera or global) in
      /storage/services/frigate/config.yml on the M920q — a file with zero
