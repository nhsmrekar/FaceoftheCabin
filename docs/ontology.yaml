  - id: custody_day_log
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Custody day record"
    source: localStorage["smrekar_custody_log"] (date → 'dad'|'mom' map)
    rendering:
      semantic: "Recorded nights: Dad 6, Mom 8"
      systems: Custody Day Fact Table
      technical: "materializeCustodyLog() → { 'YYYY-MM-DD': 'dad'|'mom', ... }"
      compliance: Historical Custody Record
    definition: >
      A materialized, append-only record of which parent actually had the
      children on each date, walked forward one day at a time from the
      earliest known schedule version through today. Once a date is
      recorded it is never overwritten by a later rule or holiday edit —
      the factual record of how the schedule actually ran stays intact.
    relationships:
      - target: parenting_schedule_rule_version
        type: derives_from
        cardinality: "N:1"
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
      - target: observation_report
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      On each app load, materializeCustodyLog() fills in any date from the
      last-recorded day through today via ownerOfDate(date), then persists.
    relates_to:
      ui_components: [ui_schedule_tab]
      elements: [observation_report]
    notes: >
      Local to whichever browser/device ran the materialization — not yet
      synced across devices. See ROADMAP.md for moving this to the shared
      Platform API backend if a cross-device record is needed.

  - id: observation_report
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Observations"
    source: custody_day_log (recorded) + parenting_schedule_rule_version + holiday_override (scheduled)
    rendering:
      semantic: "Recorded: Dad 6 · Mom 8 nights this cycle"
      systems: Custody Pivot Report
      technical: observationsReport(periodType, refDate) → { pastDad, pastMom, futureDad, futureMom }
      compliance: Custody Distribution Report
    definition: >
      Pivot-style reporting of nights per parent over a selected period —
      current 2-week cycle, trailing/upcoming 3 months, or a discrete
      calendar year (Jan 1 - Dec 31). Splits each period into "recorded"
      (dates up to today, from custody_day_log) and "scheduled" (future
      dates, computed live from the active rule and any holidays).
    relationships:
      - target: custody_day_log
        type: derives_from
        cardinality: "N:1"
      - target: parenting_schedule_rule_version
        type: derives_from
        cardinality: "N:1"
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
    relates_to:
      ui_components: [settings_panel]
      elements: [custody_day_log, parenting_schedule_rule_version, holiday_override]
    notes: >
      Available to any signed-in user, not admin-gated — intended as a
      shared, symmetric record both parents can view, not a one-sided tool.

  - id: custody_status_card
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "Kids at Dad's / Kids at Mom's"
    source: custody_status + next_custody_transition + hub_family_name
    rendering:
      semantic: Kids at Dad's / Kids at Mom's card
      systems: Custody Status Card
      technical: "#custody-card .glass-card (position:absolute top-right of #top-bar)"
      compliance: (not shown)
    definition: >
      The glass card in the upper-right corner of the Family Hub display
      showing the current custody state (home or away icon, text label)
      and next transition date below it. Updates every minute via setInterval.
    relationships:
      - target: custody_status
        type: derives_from
        cardinality: "N:1"
      - target: next_custody_transition
        type: derives_from
